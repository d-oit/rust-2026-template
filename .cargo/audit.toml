# .cargo/audit.toml — cargo-audit configuration
#
# cargo-audit reads this file when running `cargo audit`. The CI workflow
# runs `cargo audit` (no flags) so it consults this config. cargo-deny has its
# own `[advisories]` table in `deny.toml`; keep both in sync.
#
## Why `ignore` is empty:
# The rustls / rustls-webpki / h2 advisories (RUSTSEC-2026-0049, -0098,
# -0099, -0104, -0258, -0346, -0349, -0382) were previously suppressed here.
# They are no longer needed: `hybrid-storage-template` depends on libsql with
# `default-features = false, features = ["core"]`, which drops libsql's
# default `tls` feature and with it the whole
#   hyper-rustls 0.25 → rustls 0.22 → rustls-webpki 0.102.8
# stack. Those crate versions are unpatchable on their own release lines
# (rustls-webpki 0.102.x has no fixed release; fixes landed in 0.103.16+),
# so removing the dependency edge is the only durable remedy.
# Do not re-add suppressions here — fix the dependency edge instead.
# Tracking: https://github.com/tursodatabase/libsql/issues/2266

[advisories]
ignore = []
