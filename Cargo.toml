[workspace]
members = [
    "crates/*",
    "examples/*",
]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.87"
license = "MIT"
authors = ["Your Name"]
repository = "https://github.com/your-org/your-repo"
homepage = "https://github.com/your-org/your-repo"
documentation = "https://docs.rs/your-crate"
readme = "README.md"

# ─── Workspace-wide dependency versions ───────────────────────────────────────
[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
tokio-util = { version = "0.7" }

# Error handling
thiserror = "2"
anyhow = "1"

# Serialization
# Bolt: Pinned to =1.0.194 to avoid banned dependency `serde_core` (added in 1.0.222+)
serde = { version = "=1.0.194", features = ["derive"] }
serde_json = "=1.0.143"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Async traits
async-trait = "0.1"

# Testing
tokio-test = "0.4"
proptest = "1"
# Bolt: Pinned to =1.40.0 to avoid transitive dependency on banned `serde_core` via newer `serde`
insta = { version = "=1.47.2", features = ["yaml"] }

# ─── Build profiles ───────────────────────────────────────────────────────────
# NOTE: Detailed dev profile settings are in .cargo/config.toml for WSL2/Linux
# disk space optimization and fast linker configuration.

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.release-full]
opt-level = 3
lto = true
codegen-units = 1
strip = true
inherits = "release"

# For benchmarks - optimized but with symbols
[profile.bench]
opt-level = 3
debug = true

# ─── cargo-mutants configuration ─────────────────────────────────────────────
[workspace.metadata.cargo-mutants]
# Skip example crates and generated code from mutation testing
exclude_re = [
    "^examples/",
    "^src/generated/",
]
