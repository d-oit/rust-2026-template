[workspace]
members = ["crates/*", "examples/*", "benchmarks"]
default-members = ["crates/sample-app"]
resolver = "3"
exclude = ["fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
# TODO: Replace these with your actual project metadata
authors = ["Your Name"]
repository = "https://github.com/your-org/your-repo"
homepage = "https://github.com/your-org/your-repo"
documentation = "https://docs.rs/your-crate"
readme = "README.md"
include = [
    "/src",
    "/examples",
    "/tests",
    "/benchmarks",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "NOTICE",
    "VERSION",
]

[package]
name = "rust-2026-template"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "A production-ready Rust workspace template with modern tooling, CI/CD, and AI agent integration"
include = [
    "/src",
    "/examples",
    "/tests",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "NOTICE",
    "VERSION",
]

[lints]
workspace = true

[dependencies]
# Root crate has no runtime dependencies — src/lib.rs only provides an
# example `add()` function.  Heavy optional deps (libsql, rayon, wasm-bindgen,
# tracing-opentelemetry, etc.) live directly in the crates that consume them.
tokio = { workspace = true, features = ["rt-multi-thread", "macros"], optional = true }

[dev-dependencies]
insta = { workspace = true }
serde_json = { workspace = true }

[features]
default = []
# These features are provided as a demonstration of workspace-level feature
# flags.  Enable them to pull in optional workspace dependencies through
# the root crate, or enable them directly in the crate that needs them.
#
# cli             - CLI binary support (clap, anyhow, colored)
# persistence     - SQL persistence backend (libsql)
# parallel        - CPU parallelism via rayon
# wasm            - WASM build target support
# tracing-json    - JSON tracing output
# tracing-opentelemetry - OpenTelemetry tracing backend
cli = ["dep:tokio"]
persistence = []
parallel = []
wasm = []
tracing-json = []
tracing-opentelemetry = []

# `tokio` is intentionally included here as a demonstration of how an optional
# workspace dependency pulled in via a feature flag should be declared.  The
# root crate's `src/lib.rs` is a minimal example and does not currently use
# tokio itself; downstream binaries that enable `--features cli` are
# expected to consume it.  Silence cargo-machete so the demonstration isn't
# flagged as actually-unused.
[package.metadata.cargo-machete]
ignored = ["tokio"]

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
# Enable all clippy lints at warning level
all = { level = "warn", priority = -1 }

# Pedantic/nursery too strict for most projects
pedantic = { level = "allow", priority = -1 }
nursery = { level = "allow", priority = -1 }

# ── Agent-safety: prevent silencing lints instead of fixing code ──────────────
# allow_attributes = "deny" blocks any #[allow(clippy::...)] annotation from
# being introduced by AI agents or contributors. Fixes must be real, not silenced.
allow_attributes = "deny"

# Correctness: warn on panic-inducing patterns in library code
# Library targets must use proper error handling (deny), tests/examples may allow.
unwrap_used = "deny"
expect_used = "deny"
panic = "warn"

# Promoted pedantic lints for correctness
float_cmp = "warn"
significant_drop_tightening = "warn"
cast_precision_loss = "warn"
cast_possible_truncation = "warn"
redundant_clone = "warn"
map_unwrap_or = "warn"
unnecessary_map_or = "warn"
missing_const_for_fn = "warn"

# Common justified allows
too_many_arguments = "allow"
type_complexity = "allow"
cognitive_complexity = "allow"

# ─── Workspace crate layering ────────────────────────────────────────────────
# Dependencies flow strictly left-to-right (upward only):
#
#   *-types / *-domain
#       └─→  *-core / *-logic
#                └─→  *-adapters / *-backends
#                         └─→  *-cli / *-bin
#
# No crate may depend on a crate to its right in this chain.
# Violations are caught by `cargo deny` (see deny.toml).
# ─────────────────────────────────────────────────────────────────────────────

# ─── Workspace-wide dependency versions ───────────────────────────────────────
[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
tokio-util = { version = "0.7" }
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive", "env"] }
async-trait = "0.1" # Required for dyn Trait + async fn (not yet native in Rust 2024)
tokio-test = "0.4"
proptest = "1"
insta = { version = "1", features = ["yaml"] }
colored = "3"
criterion = { version = "0.5", features = ["html_reports"] }

# ─── Build profiles ───────────────────────────────────────────────────────────
[profile.dev]
opt-level = 0

[profile.dev.build-override]
opt-level = 3

[profile.fast-dev]
inherits = "dev"
debug = 0
strip = "debuginfo"
panic = "abort"

[profile.fast-dev.build-override]
opt-level = 3

# Optimised release: maximum runtime performance at the cost of build time.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = "symbols"

# Alias for release with the same settings — kept for backward compatibility
[profile.release-full]
inherits = "release"

# Fast CI profile: 95% of release perf at ~50% compile time.
[profile.ci]
inherits = "release"
lto = "thin"
codegen-units = 16
strip = false

[profile.bench]
opt-level = 3
debug = true

# ─── cargo-mutants configuration ─────────────────────────────────────────────
[workspace.metadata.cargo-mutants]
exclude_re = [
    "^examples/",
    "^crates/xtask/",
]
