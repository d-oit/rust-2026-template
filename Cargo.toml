[workspace]
members = [
    "crates/*",
    "examples/*",
    "benchmarks",
]
resolver = "3"
exclude = ["fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Your Name"]
repository = "https://github.com/your-org/your-repo"
homepage = "https://github.com/your-org/your-repo"
documentation = "https://docs.rs/your-crate"
readme = "README.md"
include = [
    "/src",
    "/examples",
    "/tests",
    "/benchmarks",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "NOTICE",
    "VERSION",
]

[package]
name = "rust-2026-template"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "A production-ready Rust workspace template with modern tooling, CI/CD, and AI agent integration"
include = [
    "/src",
    "/examples",
    "/tests",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "NOTICE",
    "VERSION",
]

[lints]
workspace = true

[dependencies]
# Root crate has no runtime dependencies — src/lib.rs only provides an
# example `add()` function.  Workspace-level optional deps (clap, libsql,
# rayon, rmcp, etc.) live in [workspace.dependencies] and are consumed by
# crates/sample-app and crates/*-template directly.
tokio = { workspace = true, features = ["rt-multi-thread", "macros"], optional = true }

[dev-dependencies]
insta = { workspace = true }
serde_json = { workspace = true }

[features]
default = []
# These features are provided as a demonstration of workspace-level feature
# flags.  Enable them to pull in optional workspace dependencies through
# the root crate, or enable them directly in the crate that needs them.
#
# cli             - CLI binary support (clap, anyhow, colored)
# persistence     - SQL persistence backend (libsql)
# parallel        - CPU parallelism via rayon
# wasm            - WASM build target support
# mcp             - MCP server support (requires cli)
# tracing-json    - JSON tracing output
# tracing-opentelemetry - OpenTelemetry tracing backend
cli = ["dep:tokio"]
persistence = []
parallel = []
wasm = []
mcp = ["cli"]
tracing-json = []
tracing-opentelemetry = []

[workspace.lints.rust]
missing_docs = "allow"
unsafe_code = "forbid"
dead_code = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }
nursery = { level = "allow", priority = -1 }

# Promoted from pedantic — correctness signals (Phase A)
float_cmp = "warn"
significant_drop_tightening = "warn"
cast_precision_loss = "warn"
cast_possible_truncation = "warn"
redundant_clone = "warn"
map_unwrap_or = "warn"
unnecessary_map_or = "warn"

# Promoted from nursery — free compile-time wins (Phase A)
missing_const_for_fn = "warn"

# Library DX lints — Phase C (flip to warn after docs stabilise)
missing_errors_doc = "allow"
must_use_candidate = "allow"

# Justified allows for template hot-path patterns
too_many_arguments = "allow"
type_complexity = "allow"
unwrap_used = "allow"
expect_used = "allow"
panic = "allow"
print_stdout = "allow"
print_stderr = "allow"
cognitive_complexity = "allow"

# ─── Workspace crate layering ────────────────────────────────────────────────
# Dependencies flow strictly left-to-right (upward only):
#
#   *-types / *-domain
#       └─→  *-core / *-logic
#                └─→  *-adapters / *-backends
#                         └─→  *-cli / *-bin
#
# No crate may depend on a crate to its right in this chain.
# Violations are caught by `cargo deny` (see deny.toml).
# ─────────────────────────────────────────────────────────────────────────────

# ─── Workspace-wide dependency versions ───────────────────────────────────────
[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
tokio-util = { version = "0.7" }
thiserror = "2"
anyhow = "1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive", "env"] }
async-trait = "0.1" # Required for dyn Trait + async fn (not yet native in Rust 2024)
tokio-test = "0.4"
proptest = "1"
insta = { version = "=1.48.0", features = ["yaml"] }
colored = "3"
libsql = { version = "0.9", default-features = false }
rayon = "1"
criterion = { version = "0.5", features = ["html_reports"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
tracing-opentelemetry = "0.33"
opentelemetry = "0.32"
rmcp = { version = "=1.8.0", features = ["server", "macros"] }

# ─── Build profiles ───────────────────────────────────────────────────────────
[profile.dev]
opt-level = 0

# Optimised release: maximum runtime performance at the cost of build time.
# - lto = "fat"       — Full cross-crate link-time optimisation; slower builds,
#                        smaller and faster binaries. Use "thin" for faster CI
#                        iterations during development.
# - codegen-units = 1 — Maximises inlining across modules; hurts parallelism.
# - panic = "unwind"  — Keeps stack unwinding (required for catch_unwind in
#                        libraries). Switch to "abort" for binaries when you
#                        don't need panic handling — cuts binary size ~10 %.
# - strip = "symbols" — Remove all symbol info; use "debuginfo" if you need
#                        production backtraces.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = "symbols"

# Alias for release with the same settings — kept for backward compatibility
# with tooling that references "release-full".
[profile.release-full]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
inherits = "release"

[profile.bench]
opt-level = 3
debug = true

# ─── cargo-mutants configuration ─────────────────────────────────────────────
[workspace.metadata.cargo-mutants]
exclude_re = [
    "^examples/",
]
