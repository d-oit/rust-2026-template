[workspace]
members = [
    "crates/*",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Your Name <your@email.com>"]
repository = "https://github.com/your-org/your-repo"
homepage = "https://github.com/your-org/your-repo"
documentation = "https://docs.rs/your-crate"
readme = "README.md"

# ─── Workspace-wide dependency versions ───────────────────────────────────────
[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7" }

# Error handling
thiserror = "2"
anyhow = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Async traits
async-trait = "0.1"

# Testing
tokio-test = "0.4"
proptest = "1"
insta = { version = "1", features = ["yaml"] }

# ─── Build profiles ───────────────────────────────────────────────────────────
# NOTE: .cargo/config.toml handles debug symbols for WSL2 disk space optimization.

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.release-full]
opt-level = 3
lto = true
codegen-units = 1
strip = true
inherits = "release"

# For benchmarks - optimized but with symbols
[profile.bench]
opt-level = 3
debug = true
