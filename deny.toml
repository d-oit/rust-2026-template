# deny.toml - cargo-deny configuration for supply chain security
# Run: cargo deny check
# Compatible with cargo-deny v2+

[graph]
# Rust edition for the dependency graph
all-features = false
no-default-features = false

[output]
feature-depth = 1

# ============================================================
# ADVISORIES - Check for security vulnerabilities
# ============================================================
[advisories]
version = 2
# Deny crates with security vulnerabilities
ignore = [
  # paste is unmaintained but is a transitive dep of rmcp (MCP SDK); no replacement available yet
  { id = "RUSTSEC-2024-0436", reason = "paste is a transitive dep of rmcp; no drop-in replacement" },
]

# ============================================================
# LICENSES - Enforce acceptable licenses (cargo-deny v2 format)
# ============================================================
[licenses]
version = 2
# List of allowed licenses (SPDX identifiers)
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "CC0-1.0",
  "Zlib",
  "BSL-1.0",
  "OpenSSL",
  "MPL-2.0",
]
# Exceptions for specific crates with special licenses
# Uncomment and fill in when needed:
# [[licenses.exceptions]]
# allow = ["LicenseRef-ring"]
# name = "ring"
# version = "*"

# ============================================================
# BANS - Block specific crates or versions
# ============================================================
[bans]
# Deny multiple versions of the same crate
multiple-versions = "warn"
# Deny wildcard dependencies
wildcards = "deny"
# Deny workspace default members being listed explicitly
highlight = "all"
# Deny known problematic crates
deny = [    # Old unmaintained openssl bindings
    # { name = "openssl", reason = "use rustls instead" },

    # Prevent domain/core crates from depending on entry-point crates.
  # Add specific crate name pairs as the workspace grows.
  # [[bans.deny]]
  # Example: name = "your-crate-cli", wrappers = ["your-crate-core"]
]
# Allow certain duplicate versions that are unavoidable
skip = [
  # { name = "example-crate", version = "=1.0.0" }
]
skip-tree = [
  # { name = "windows-sys", version = "=0.48" }
]

# ============================================================
# SOURCES - Restrict crate sources
# ============================================================
[sources]
# Only allow crates from crates.io and git repos
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
# Allow crates from specific GitHub orgs
github = []
gitlab = []
bitbucket = []
