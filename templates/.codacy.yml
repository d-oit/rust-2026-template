# Codacy Configuration Template
# Copy this to .codacy.yml or .codacy/codacy.yml in your project
version: "1"

engines:
  eslint:
    enabled: false
  rust-clippy:
    enabled: true
  markdownlint:
    enabled: true

exclude_patterns:
  - "target/"
  - "tests/"
  - "examples/"
  - "benchmarks/"
  - "fuzz/"
  - "docs/"
  - "scripts/"
