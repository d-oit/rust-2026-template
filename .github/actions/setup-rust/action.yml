---
name: Setup Rust Environment
description: Composite action to set up sccache, rust-cache, and rust-toolchain

inputs:
  toolchain:
    description: Rust toolchain to use
    required: false
    default: stable
  components:
    description: Additional rustup components to install
    required: false
    default: ""
  cache-on-failure:
    description: >-
      Whether `Swatinem/rust-cache` should save the cache when the workflow
      fails. Default `true` (safe for most jobs). Set to `false` for jobs
      that can poison the cache with stale `.fingerprint/` lint metadata.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Enable sccache
      uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696

    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      with:
        cache-on-failure: ${{ inputs.cache-on-failure }}
