---
# .github/release-drafter.yml
# Configuration for automated release notes drafting

name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: 'Features'
    labels:
      - 'feature'
      - 'enhancement'
  - title: 'Bug Fixes'
    labels:
      - 'fix'
      - 'bugfix'
      - 'bug'
  - title: 'Security'
    labels:
      - 'security'
  - title: 'Maintenance'
    labels:
      - 'chore'
      - 'deps'
      - 'dependencies'
      - 'refactor'
  - title: 'Documentation'
    labels:
      - 'docs'
      - 'documentation'
  - title: 'Testing'
    labels:
      - 'test'
      - 'tests'

change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&'

version-resolver:
  major:
    labels:
      - 'major'
  minor:
    labels:
      - 'minor'
      - 'feature'
      - 'enhancement'
  patch:
    labels:
      - 'patch'
      - 'fix'
      - 'bugfix'
      - 'chore'
      - 'deps'
      - 'dependencies'
  default: patch

autolabeler:
  - label: 'chore'
    title:
      - '/^chore/i'
  - label: 'fix'
    title:
      - '/^fix/i'
  - label: 'feature'
    title:
      - '/^feat/i'
  - label: 'docs'
    title:
      - '/^docs/i'
  - label: 'security'
    title:
      - '/^security/i'

exclude-labels:
  - 'skip-changelog'

template: |
  ## Changes

  $CHANGES

  ## Contributors

  $CONTRIBUTORS
