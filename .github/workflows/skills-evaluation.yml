---
name: Skills Evaluation

on:
  push:
    branches: [main]
    paths:
      - '.agents/skills/**'
      - '.agents/skills-evaluation/**'
  pull_request:
    branches: [main]
    paths:
      - '.agents/skills/**'
      - '.agents/skills-evaluation/**'
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Run Structure Check
        run: |
          mkdir -p .agents/skills-evaluation/iterations/ci-run
          ./.agents/skills-evaluation/scripts/structure_check.sh .agents/skills-evaluation/iterations/ci-run

      - name: Generate Report
        run: |
          python3 .agents/skills-evaluation/scripts/generate_report.py .agents/skills-evaluation/iterations/ci-run

      - name: Upload Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: skill-evaluation-report
          path: .agents/skills-evaluation/iterations/ci-run/report.md
