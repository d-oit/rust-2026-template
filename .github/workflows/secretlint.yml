---
name: Secret Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  secretlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: .agents/skills/secret-lint/package-lock.json

      - name: Install dependencies
        run: |
          cd .agents/skills/secret-lint
          npm ci

      - name: Run secretlint
        run: ./.agents/skills/secret-lint/node_modules/.bin/secretlint --format junit "**/*"
