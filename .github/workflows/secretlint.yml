---
name: Secret Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  secretlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: .agents/skills/secret-lint/package-lock.json

      - name: Install dependencies
        run: |
          cd .agents/skills/secret-lint
          npm ci

      - name: Run secretlint
        run: ./.agents/skills/secret-lint/node_modules/.bin/secretlint --format junit "**/*"
