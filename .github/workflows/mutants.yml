---
# .github/workflows/mutants.yml
name: Mutation Testing

on:
  # Scheduled: weekly mutation testing (Tier 3 — heavy)
  # Manual: workflow_dispatch for ad-hoc runs
  # PR trigger removed — mutation tests are too expensive for every PR.
  # Use the "run-mutants" label on a PR to trigger via workflow_dispatch.
  push:
    branches: [main, develop]
    paths:
      - 'crates/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'  # Weekly Monday 03:00 UTC

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false  # Never cancel mutation runs mid-way

jobs:
  mutants:
    name: cargo-mutants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
      - uses: ./.github/actions/setup-rust
      - name: Install cargo-mutants and nextest
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32  # v2
        with:
          tool: cargo-mutants,cargo-nextest

      - name: Run mutation tests
        run: |
          cargo mutants \
            --workspace \
            --test-tool nextest \
            --jobs 4 \
            -- --profile ci
        continue-on-error: true  # Don't fail CI on surviving mutants; report instead

      - name: Upload mutation report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        if: always()
        with:
          name: mutants-report
          path: mutants.out/
          retention-days: 30
