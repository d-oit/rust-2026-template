---
# .github/workflows/mutants.yml
name: Mutation Testing

on:
  # Scheduled: weekly mutation testing (Tier 3 — heavy)
  # Manual: workflow_dispatch for ad-hoc runs
  # PR trigger removed — mutation tests are too expensive for every PR.
  # Use the "run-mutants" label on a PR to trigger via workflow_dispatch.
  push:
    branches: [main, develop]
    paths:
      - 'crates/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'  # Weekly Monday 03:00 UTC

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false  # Never cancel mutation runs mid-way

jobs:
  mutants:
    name: cargo-mutants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          cache-on-failure: true

      - name: Enable sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696  # v0.0.10

      - name: Install mold linker
        run: |
          sudo apt-get update
          sudo apt-get install -y mold

      - name: Install cargo-mutants and nextest
        uses: taiki-e/install-action@7a79fe8c3a13344501c80d99cae481c1c9085912  # v2
        with:
          tool: cargo-mutants,cargo-nextest

      - name: Run mutation tests
        run: |
          cargo mutants \
            --workspace \
            --test-tool nextest \
            --jobs 4 \
            -- --profile ci
        continue-on-error: true  # Don't fail CI on surviving mutants; report instead

      - name: Upload mutation report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: always()
        with:
          name: mutants-report
          path: mutants.out/
          retention-days: 30
