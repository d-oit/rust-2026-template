---
# .github/workflows/mutants.yml
name: Mutation Testing

on:
  push:
    branches: [main, develop]
    paths:
      - 'crates/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    branches: [main, develop]
    paths:
      - 'crates/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'  # Weekly Monday 03:00 UTC

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false  # Never cancel mutation runs mid-way

jobs:
  mutants:
    name: cargo-mutants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae  # v2
        with:
          cache-on-failure: true

      - name: Enable sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Install mold linker
        run: |
          sudo apt-get update
          sudo apt-get install -y mold

      - name: Install cargo-mutants and nextest
        uses: taiki-e/install-action@e49978b799e49ff429d162b7a30601a569ab6538  # v2
        with:
          tool: cargo-mutants,cargo-nextest

      - name: Run mutation tests
        run: |
          cargo mutants \
            --workspace \
            --test-tool nextest \
            --jobs 4 \
            -- --profile ci
        continue-on-error: true  # Don't fail CI on surviving mutants; report instead

      - name: Upload mutation report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutants-report
          path: mutants.out/
          retention-days: 30
