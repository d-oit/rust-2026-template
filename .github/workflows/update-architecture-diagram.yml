name: Update Architecture Diagram

on:
  push:
    paths:
      - "Cargo.toml"
      - "crates/**/Cargo.toml"
      - "crates/*/src/**/*.rs"
      - ".agents/skills/*/SKILL.md"
      - ".agents/skills/architecture-diagram/scripts/**"
      - ".agents/ORCHESTRATION.md"
      - "docs/diagram-config.json"
    branches:
      - main
      - "chore/**"
      - "feat/**"
      - "fix/**"
  pull_request:
    paths:
      - ".agents/skills/architecture-diagram/scripts/**"
      - "Cargo.toml"
      - "crates/**/Cargo.toml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # On pull_request events check out the actual head branch so we can push back to it.
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cairosvg (SVG → PNG, pure Python)
        run: pip install cairosvg

      - name: Regenerate sketchnote architecture SVG + PNG
        run: |
          python .agents/skills/architecture-diagram/scripts/generate_architecture_svg.py \
            --root . \
            --svg-out docs/src/architecture.svg \
            --png-out docs/src/architecture.png

      - name: Regenerate overview diagram (Excalidraw-based)
        run: |
          python .agents/skills/architecture-diagram/scripts/generate_overview.py \
            --root . \
            --no-export \
            --out .template/overview.excalidraw

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet docs/src/architecture.svg docs/src/architecture.png .template/overview.excalidraw; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/src/architecture.svg docs/src/architecture.png .template/overview.excalidraw
          git commit -m "docs: regenerate diagrams [skip ci]"
          git push
