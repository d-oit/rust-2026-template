name: Update Architecture Diagram

on:
  push:
    paths:
      - "Cargo.toml"
      - "crates/**/Cargo.toml"
      - "crates/*/src/**/*.rs"
      - ".agents/skills/*/SKILL.md"
      - ".agents/skills/architecture-diagram/scripts/**"
      - ".agents/ORCHESTRATION.md"
      - "docs/diagram-config.json"
    branches:
      - main
      - "chore/**"
      - "feat/**"
      - "fix/**"
  pull_request:
    paths:
      - ".agents/skills/architecture-diagram/scripts/**"
      - "Cargo.toml"
      - "crates/**/Cargo.toml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # On pull_request events check out the actual head branch so we can push back to it.
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Graphviz
        run: sudo apt-get install -y graphviz

      - name: Install Node dependencies
        run: npm ci

      - name: Regenerate architecture diagram
        run: |
          python .agents/skills/architecture-diagram/scripts/generate_diagram.py \
            --root . \
            --out .template/architecture.excalidraw \
            --svg-out .template/architecture.svg \
            --png-out .template/architecture.png

      - name: Regenerate overview diagram
        run: |
          python .agents/skills/architecture-diagram/scripts/generate_overview.py \
            --root . \
            --out .template/overview.excalidraw \
            --svg-out .template/overview.svg \
            --png-out .template/overview.png

      - name: Copy diagrams to docs
        run: |
          mkdir -p docs/src
          cp .template/architecture.svg docs/src/architecture.svg
          cp .template/architecture.png docs/src/architecture.png
          cp .template/overview.svg     docs/src/overview.svg
          cp .template/overview.png     docs/src/overview.png

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet .template/ docs/src/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .template/ docs/src/
          git commit -m "docs: regenerate diagrams [skip ci]"
          git push
