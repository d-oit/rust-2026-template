---
name: Update Overview Diagram

on:
  push:
    paths:
      - "Cargo.toml"
      - "crates/**/Cargo.toml"
      - ".agents/skills/*/SKILL.md"
    branches: [main]
  workflow_dispatch:

concurrency:
  group: update-architecture-diagram
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: .agents/skills/architecture-diagram/package-lock.json

      - name: Install Node dependencies
        working-directory: .agents/skills/architecture-diagram
        run: npm ci

      - name: Regenerate and push overview diagram
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          MAX_RETRIES=5
          count=0

          while [ $count -lt $MAX_RETRIES ]; do
            count=$((count + 1))
            echo "Attempt $count of $MAX_RETRIES..."

            git fetch origin main
            git reset --hard origin/main

            python .agents/skills/architecture-diagram/scripts/generate_overview.py \
              --root . \
              --out .template/overview.excalidraw \
              --svg-out .template/overview.svg \
              --png-out .template/overview.png

            cp .template/overview.svg docs/src/overview.svg

            if git diff --quiet .template/ docs/src/overview.svg; then
              echo "No diagram changes detected against latest main."
              exit 0
            fi

            git add .template/ docs/src/overview.svg
            git commit -m "docs: regenerate overview diagram [skip ci]"

            if git push origin main; then
              echo "Successfully pushed architecture diagram update."
              exit 0
            fi

            echo "Push failed due to concurrent update, retrying..."
            sleep 2
          done

          echo "Direct push to main was declined (branch protection or repository rules). Falling back to PR..."
          BRANCH="docs/update-overview-diagram"
          git checkout -B "$BRANCH"
          if git push -u origin "$BRANCH" --force; then
            gh pr create \
              --title "docs: regenerate overview diagram [skip ci]" \
              --body "Automated overview diagram update generated against main." \
              --base main \
              --head "$BRANCH" || echo "PR already exists or created"
            exit 0
          fi
          echo "Failed to push architecture diagram or create fallback PR."
          exit 1
