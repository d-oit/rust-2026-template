---
name: Update Overview Diagram

on:
  push:
    paths:
      - "Cargo.toml"
      - "crates/**/Cargo.toml"
      - "examples/**/Cargo.toml"
      - "benchmarks/Cargo.toml"
      - ".agents/skills/*/SKILL.md"
      - "scripts/*.sh"
      - "config/xtask.json"
      - ".github/workflows/*.yml"
    branches: [main]
  workflow_dispatch:

concurrency:
  group: update-architecture-diagram
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: .agents/skills/architecture-diagram/package-lock.json

      - name: Install Node dependencies
        working-directory: .agents/skills/architecture-diagram
        run: npm ci

      - name: Regenerate and push overview diagram
        # gh needs an explicit token. Without GH_TOKEN it exits non-zero
        # immediately, and the previous `|| echo ...` swallowed that failure so
        # the job reported success having published nothing.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="docs/update-overview-diagram"
          TITLE="docs: regenerate overview diagram [skip ci]"
          BODY="Automated overview diagram update generated against main."

          git fetch origin main
          git reset --hard origin/main

          python .agents/skills/architecture-diagram/scripts/generate_overview.py \
            --root . \
            --out .template/overview.excalidraw \
            --svg-out .template/overview.svg \
            --png-out .template/overview.png

          cp .template/overview.svg docs/src/overview.svg
          cp .template/overview.png docs/src/overview.png

          if git diff --quiet .template/ docs/src/overview.svg docs/src/overview.png; then
            echo "No diagram changes detected against latest main."
            exit 0
          fi

          git add .template/ docs/src/overview.svg docs/src/overview.png
          git commit -m "${TITLE}"

          # main is protected by required checks and the PR rule, so a direct
          # push is always rejected. Try it once (covers forks and unprotected
          # repositories) and fall back to a pull request.
          if git push origin HEAD:main; then
            echo "Successfully pushed architecture diagram update to main."
            exit 0
          fi

          echo "Direct push to main was declined; opening a pull request instead."
          git push --force origin "HEAD:refs/heads/${BRANCH}"

          if gh pr view "${BRANCH}" --json number >/dev/null 2>&1; then
            echo "Pull request for ${BRANCH} already exists; branch updated in place."
            exit 0
          fi

          gh pr create --title "${TITLE}" --body "${BODY}" --base main --head "${BRANCH}"
