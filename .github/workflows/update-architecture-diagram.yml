---
name: Update Overview Diagram

on:
  push:
    paths:
      - "Cargo.toml"
      - "crates/**/Cargo.toml"
      - ".agents/skills/*/SKILL.md"
    branches: [main]
  workflow_dispatch:

concurrency:
  group: update-architecture-diagram
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: .agents/skills/architecture-diagram/package-lock.json

      - name: Install Node dependencies
        working-directory: .agents/skills/architecture-diagram
        run: npm ci

      - name: Regenerate and push overview diagram
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          MAX_RETRIES=5
          count=0

          while [ $count -lt $MAX_RETRIES ]; do
            count=$((count + 1))
            echo "Attempt $count of $MAX_RETRIES..."

            git fetch origin main
            git reset --hard origin/main

            python .agents/skills/architecture-diagram/scripts/generate_overview.py \
              --root . \
              --out .template/overview.excalidraw \
              --svg-out .template/overview.svg \
              --png-out .template/overview.png

            cp .template/overview.svg docs/src/overview.svg

            if git diff --quiet .template/ docs/src/overview.svg; then
              echo "No diagram changes detected against latest main."
              exit 0
            fi

            git add .template/ docs/src/overview.svg
            git commit -m "docs: regenerate overview diagram [skip ci]"

            if git push origin main; then
              echo "Successfully pushed architecture diagram update."
              exit 0
            fi

            echo "Push failed due to concurrent update, retrying..."
            sleep 2
          done

          echo "Failed to push architecture diagram after $MAX_RETRIES attempts."
          exit 1
