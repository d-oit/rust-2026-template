name: Update Overview Diagram

on:
  push:
    paths:
      - "Cargo.toml"
      - "crates/**/Cargo.toml"
      - ".agents/skills/*/SKILL.md"
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Regenerate overview diagram
        run: |
          python .agents/skills/architecture-diagram/scripts/generate_overview.py \
            --root . \
            --out .template/overview.excalidraw \
            --svg-out .template/overview.svg \
            --png-out .template/overview.png

      - name: Copy SVG to docs
        run: |
          cp .template/overview.svg docs/src/overview.svg

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet .template/ docs/src/overview.svg; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .template/ docs/src/overview.svg
          git commit -m "docs: regenerate overview diagram [skip ci]"
          git push
