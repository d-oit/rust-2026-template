# .github/workflows/ci.yml
# 2026 Best Practice Rust CI Pipeline
# Runs on: push to main/develop, all PRs
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Reduce cargo index update noise
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  # Enable sccache for faster builds
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  # ───────────────────────────────────────────────────
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Enable sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Clippy (all targets, all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # ───────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # Uncomment for cross-platform CI:
        # os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Enable sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Install mold linker
        run: |
          sudo apt-get update
          sudo apt-get install -y mold
      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest
      - name: Build workspace
        run: cargo build --workspace --all-features
      - name: Run tests (nextest)
        run: cargo nextest run --workspace --all-features --profile ci
      - name: Run doc tests
        run: cargo test --workspace --doc

  # ───────────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Enable sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      - name: Generate lockfile
        run: cargo generate-lockfile
      - name: Run cargo audit
        run: cargo audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ───────────────────────────────────────────────────
  deny:
    name: Dependency Policy (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run cargo-deny
        run: cargo deny check
        env:
          # Unset sccache - not available in cargo-deny Docker container
          RUSTC_WRAPPER: ""

  # ───────────────────────────────────────────────────
  # Minimal versions check - ensures deps work with oldest allowed versions
  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - name: Enable sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Check MSRV
        run: cargo check --workspace

  # ───────────────────────────────────────────────────
  # Final gate - must pass for merge
  ci-success:
    name: CI Success
    needs: [fmt, clippy, test, security, deny, msrv]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[  "${{ needs.fmt.result }}" != "success" ||
                 "${{ needs.clippy.result }}" != "success" ||
                 "${{ needs.test.result }}" != "success" ||
                 "${{ needs.security.result }}" != "success" ||
                 "${{ needs.deny.result }}" != "success" ||
                 "${{ needs.msrv.result }}" != "success" ]]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
          echo "All CI jobs passed!"
