---
# .github/workflows/ci.yml
# 2026 Best Practice Rust CI Pipeline
# Runs on: push to main/develop, all PRs
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_BUILD_JOBS: "2"
  # Disable incremental compilation in CI to reduce I/O overhead.
  CARGO_INCREMENTAL: "0"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────
  # Path filtering to optimize CI execution
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
      heavy: ${{ steps.filter.outputs.heavy }}
      agents: ${{ steps.filter.outputs.agents }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - 'crates/**'
              - 'src/**'
              - 'examples/**'
              - 'tests/**'
              - 'benchmarks/**'
              - 'fuzz/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'config/**'
              - 'schema/**'
              - 'scripts/**'
              - '.cargo/**'
              - 'deny.toml'
              - 'rustfmt.toml'
              - '.clippy.toml'
              - 'do-harness.toml'
              - 'HARNESS.md'
              - 'Makefile'
              - 'Makefile.monitoring'
              - '.config/nextest.toml'
            docs:
              - '*.md'
              - '**/*.md'
            heavy:
              - 'crates/**'
              - 'src/**'
              - 'examples/**'
              - 'benchmarks/**'
              - 'fuzz/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
            agents:
              - 'AGENTS.md'
              - 'CLAUDE.md'
              - 'GEMINI.md'
              - 'QWEN.md'
              - 'agents-docs/**'
              - '.agents/skills/**'
              - '.agents/SKILLS.md'
              - '.agents/agent-adapters.toml'
              - 'schema/agent-adapters.schema.json'
              - 'scripts/validate-agent-entrypoints.sh'
              - 'scripts/generate-skills-md.sh'
            workflows:
              - '.github/workflows/**'

  # ───────────────────────────────────────────────────
  validate-agents:
    name: Validate Agent Entrypoints
    needs: [changes]
    if: >
      github.event_name != 'pull_request' ||
      needs.changes.outputs.agents == 'true' ||
      needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - name: Run agent validator
        run: ./scripts/validate-agent-entrypoints.sh
      - name: Validate adapter manifest
        run: cargo run --quiet -p xtask --bin xtask -- agents validate
        env:
          RUSTC_WRAPPER: ""
      - name: Test llms context generation
        run: bash tests/generate_llms_txt_test.sh

  # ───────────────────────────────────────────────────
  lint:
    name: Template Metadata Checks
    needs: [changes]
    if: >
      github.event_name != 'pull_request' ||
      needs.changes.outputs.code == 'true' ||
      needs.changes.outputs.agents == 'true' ||
      needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Check for placeholder values
        continue-on-error: true
        run: |
          if grep -rE 'your-org|Your Name|your-repo|your-crate' Cargo.toml; then
            echo "::warning::Placeholder values found in Cargo.toml. Run init-template.sh first."
          fi
      - name: Validate agent metrics schema
        run: |
          if [ -f .agents/metrics.jsonl ]; then
            while IFS= read -r line; do
              if [ -n "$line" ]; then
                echo "$line" | python3 -c "
          import sys, json
          try:
              d = json.load(sys.stdin)
              required = ['timestamp','agent','skill','success']
              for f in required:
                  assert f in d, f'Missing field: {f}'
          except Exception as e:
              print(f'Validation failed: {e}')
              sys.exit(1)
          " || exit 1
              fi
            done < .agents/metrics.jsonl
            echo "Agent metrics validation OK"
          fi
      # Commitlint is enforced via dedicated .github/workflows/commitlint.yml

  # ───────────────────────────────────────────────────
  # ───────────────────────────────────────────────────
  bench:
    name: Benchmarks
    needs: [changes]
    if: >
      github.event_name != 'pull_request' ||
      needs.changes.outputs.heavy == 'true' ||
      needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
      - uses: ./.github/actions/setup-rust
      - name: Run benchmarks
        run: |
          set -o pipefail
          cargo bench --workspace 2>&1 | tee bench-output.txt
      - name: Test benchmark parser
        run: bash tests/parse_bench_test.sh
      - name: Parse and save bench results
        run: |
          set -euo pipefail
          BENCH_DIR="benchmarks/events/$(date -u +%Y/%m/%d)"
          mkdir -p "${BENCH_DIR}"
          python3 scripts/parse_bench.py bench-output.txt \
            ${{ github.sha }} $(date -u +%Y-%m-%dT%H:%M:%SZ) target/criterion \
            > "${BENCH_DIR}/${{ github.sha }}.jsonl"
          rows=$(wc -l < "${BENCH_DIR}/${{ github.sha }}.jsonl")
          echo "Recorded ${rows} benchmark rows"
          if [ "${rows}" -eq 0 ]; then
            echo "::error::benchmark run produced no rows; the telemetry pipeline is broken"
            exit 1
          fi
      - name: Update benchmark history
        run: bash scripts/update-bench-history.sh
      - name: Benchmark comparison (informational)
        run: |
          set -uo pipefail
          {
            echo "### Benchmark comparison (informational)"
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          bash scripts/compare-benchmarks.sh \
            --commit-a auto --commit-b "${{ github.sha }}" 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload benchmark events
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: benchmark-events
          path: |
            benchmarks/events/
            benchmarks/history.jsonl

  # ───────────────────────────────────────────────────
  version-check:
    name: VERSION consistency check
    needs: [changes]
    if: >
      github.event_name != 'pull_request' ||
      needs.changes.outputs.code == 'true' ||
      needs.changes.outputs.agents == 'true' ||
      needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Check VERSION matches Cargo.toml
        run: bash scripts/propagate-version.sh --check
      - name: Check template version badge matches changelog
        run: bash scripts/check-template-version.sh
      - name: Check llms.txt is current
        run: |
          bash scripts/generate-llms-txt.sh
          git diff --exit-code llms.txt || (echo "llms.txt is stale, run scripts/generate-llms-txt.sh" && exit 1)
      - name: Check .agents/SKILLS.md is current
        run: |
          bash scripts/generate-skills-md.sh
          MSG="regenerate with scripts/generate-skills-md.sh"
          git diff --exit-code .agents/SKILLS.md \
            || (echo ".agents/SKILLS.md is stale, ${MSG}" && exit 1)

  # ───────────────────────────────────────────────────
  # ───────────────────────────────────────────────────
  # Config-driven verification (issue #285): which checks run per trigger is decided by
  # config/xtask.json — not by magic values in this YAML. PRs run the fast `pull-request`
  # tier; pushes to protected branches run the deep `protected-branch` tier. The GHA job
  # summary also prints the resolved plan for every configured tier.
  #
  # The job name MUST stay a static literal. A `name:` containing a `${{ }}`
  # expression is only evaluated when the job RUNS; when the job is skipped,
  # GitHub reports the raw unevaluated expression as the check name (e.g.
  # "Quality Gate (${{ github.event_name == ... }})"). A branch ruleset that
  # requires the context "Quality Gate (pull-request)" then never matches a
  # skipped job, and the PR is blocked from merging with no failing check to
  # explain why. Keep this name in sync with the required_status_checks
  # contexts in the repository ruleset.
  quality-gate:
    name: Quality Gate (pull-request)
    needs: [changes]
    if: >
      github.event_name != 'pull_request' ||
      needs.changes.outputs.code == 'true' ||
      needs.changes.outputs.docs == 'true' ||
      needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    outputs:
      # Exposed so `CI Success` can validate the fast path against the same
      # decision the gate acted on. Empty on non-PR events.
      maintenance_only: ${{ steps.classify.outputs.maintenance_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Classification runs before any toolchain installation (issue #503). It
      # needs only the runner's python3, so a generated-maintenance PR never pays
      # the Rust/shell/YAML/actionlint setup cost. The decision is fail-closed and
      # published for the PR Merge Policy Gate and CI telemetry.
      - name: Classify generated maintenance PR
        id: classify
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_ACTOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          mkdir -p .agents/ci
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            > .agents/ci/pr-files.json
          python3 scripts/classify-maintenance-pr.py \
            --files-from .agents/ci/pr-files.json \
            --actor "$PR_ACTOR" \
            --head-ref "$PR_HEAD_REF" \
            --base-ref "$PR_BASE_REF" \
            --event "$GITHUB_EVENT_NAME" \
            > .agents/ci/maintenance-classification.json
          MAINTENANCE=$(python3 -c 'import json; \
          print(str(json.load(open(".agents/ci/maintenance-classification.json"))["maintenance_only"]).lower())')
          echo "maintenance_only=${MAINTENANCE}" >> "$GITHUB_OUTPUT"
          {
            echo "### Generated maintenance classification"
            echo ""
            echo '```json'
            cat .agents/ci/maintenance-classification.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Run generated maintenance validators
        if: steps.classify.outputs.maintenance_only == 'true'
        run: bash scripts/maintenance-validate.sh --classification .agents/ci/maintenance-classification.json
      # ── Full pull-request tier (unchanged behaviour) ──────────────────────
      # Everything below is skipped only when the classifier granted the fast
      # path. Every other PR runs the complete tier exactly as before.
      - name: Report resolved tier
        if: steps.classify.outputs.maintenance_only != 'true'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TIER=pull-request
          else
            TIER=protected-branch
          fi
          echo "Resolved quality tier: $TIER"
          echo "### Resolved quality tier: \`$TIER\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
        if: steps.classify.outputs.maintenance_only != 'true'
        with:
          components: llvm-tools-preview
      - uses: ./.github/actions/setup-rust
        if: steps.classify.outputs.maintenance_only != 'true'
      # Resolve which checks the tier will actually run before installing
      # optional tooling, so a Markdown-only PR does not install the Rust,
      # shell, YAML, or actionlint tool sets.
      - name: Resolve selected quality checks
        id: plan
        if: steps.classify.outputs.maintenance_only != 'true'
        run: |
          set -euo pipefail
          mkdir -p .agents/ci
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TIER=pull-request
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            TIER=protected-branch
            BASE="${{ github.event.before }}"
          fi
          if [ -n "$BASE" ]; then
            cargo run --quiet -p xtask --bin xtask -- quality plan \
              --tier "$TIER" --changed-from "$BASE" | tee .agents/ci/quality-plan.txt
          else
            cargo run --quiet -p xtask --bin xtask -- quality plan --tier "$TIER" \
              | tee .agents/ci/quality-plan.txt
          fi
          {
            echo "### Selected quality checks"
            echo ""
            echo '```'
            cat .agents/ci/quality-plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          NEEDS=$(python3 scripts/quality-plan-tools.py .agents/ci/quality-plan.txt)
          echo "needs=${NEEDS}" >> "$GITHUB_OUTPUT"
          echo "Selected tool groups: ${NEEDS}"
      - name: Install Cargo verification tooling
        if: steps.classify.outputs.maintenance_only != 'true' && contains(steps.plan.outputs.needs, 'cargo')
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b  # v2
        with:
          tool: cargo-nextest,cargo-llvm-cov
      - name: Install Rust security tooling
        if: steps.classify.outputs.maintenance_only != 'true' && contains(steps.plan.outputs.needs, 'security')
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b  # v2
        with:
          tool: cargo-audit,cargo-deny,cargo-machete
      - name: Install shell, YAML, and Markdown tooling
        if: >-
          steps.classify.outputs.maintenance_only != 'true' &&
          (contains(steps.plan.outputs.needs, 'shell') ||
          contains(steps.plan.outputs.needs, 'yaml') ||
          contains(steps.plan.outputs.needs, 'markdown'))
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck yamllint
          npm install -g markdownlint-cli2
          # PyYAML backs the workflow contract tests; do not rely on the
          # runner image shipping it, or those tests degrade to no-ops.
          python3 -m pip install --user pyyaml
      - name: Install actionlint
        if: steps.classify.outputs.maintenance_only != 'true' && contains(steps.plan.outputs.needs, 'actionlint')
        run: |
          ACTIONLINT_VERSION=1.7.12
          SCRIPT=https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash
          bash <(curl -fsSL "${SCRIPT}") "${ACTIONLINT_VERSION}" /usr/local/bin
          actionlint --version
      - name: Publish configured verification tiers
        if: steps.classify.outputs.maintenance_only != 'true'
        run: |
          echo "### Verification tiers (config/xtask.json)" >> "$GITHUB_STEP_SUMMARY"
          for tier in pull-request protected-branch scheduled release; do
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "#### Tier \`$tier\`" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cargo run --quiet -p xtask --bin xtask -- quality plan --tier "$tier" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Run trigger tier
        if: steps.classify.outputs.maintenance_only != 'true'
        env:
          XTASK_TEST_COVERAGE: "1"
        run: |
          TIER=pull-request
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            TIER=protected-branch
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          echo "Running config-driven quality tier: $TIER"
          if [ -n "$BASE" ]; then
            cargo run --quiet -p xtask --bin xtask -- quality run --tier "$TIER" --changed-from "$BASE"
          else
            cargo run --quiet -p xtask --bin xtask -- quality run --tier "$TIER"
          fi
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./lcov.info
          fail_ci_if_error: false
      - name: Validate CI quality ownership contract
        if: steps.classify.outputs.maintenance_only != 'true'
        run: bash tests/ci_quality_ownership_test.sh
      - name: Validate quality gate fail-closed contracts
        if: steps.classify.outputs.maintenance_only != 'true'
        run: bash tests/quality_gate_contracts_test.sh
      - name: Validate do-harness integration
        if: steps.classify.outputs.maintenance_only != 'true'
        run: bash tests/do_harness_integration_test.sh
      - name: Validate CI regression matrix
        if: steps.classify.outputs.maintenance_only != 'true'
        run: bash tests/ci_regression_matrix_test.sh
      - name: Validate maintenance classification and DORA artifacts
        run: bash tests/maintenance_classification_test.sh
      - name: Validate PR merge policy gate
        run: bash tests/pr_merge_policy_test.sh
      - name: Validate workflow maintenance contracts
        run: bash tests/workflow_maintenance_contract_test.sh
      - name: Validate quality-plan tool mapping
        if: steps.classify.outputs.maintenance_only != 'true'
        run: bash tests/quality_plan_tools_test.sh
      - name: Validate CI required-job evaluator
        run: bash tests/ci_required_evaluate_test.sh
      - name: Validate release provenance regression fixture
        if: steps.classify.outputs.maintenance_only != 'true'
        run: bash tests/release_provenance_test.sh
      - name: Validate trusted publishing contract
        run: bash tests/trusted_publishing_contract_test.sh
      - name: Validate trusted publishing CLI
        run: bash tests/trustpub_cli_test.sh
      - name: Validate overview diagram is current
        if: steps.classify.outputs.maintenance_only != 'true'
        run: bash tests/overview_diagram_test.sh
      - name: Validate workflow permissions
        run: bash tests/workflow_permissions_test.sh
      - name: Validate quality-gate telemetry contract
        if: steps.classify.outputs.maintenance_only != 'true'
        run: bash tests/ci_telemetry/telemetry_integration_test.sh --use-existing
      - name: Publish quality summary
        if: always()
        run: |
          if [ -f .agents/ci/quality-summary.md ]; then
            cat .agents/ci/quality-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload CI telemetry
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-telemetry
          path: .agents/ci/quality-run.json
          if-no-files-found: warn

  # ───────────────────────────────────────────────────
  ci-success:
    name: CI Success
    needs:
      - changes
      - validate-agents
      - lint
      - bench
      - version-check
      - quality-gate
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Write CI status summary
        run: |
          cat > .agents/ci/ci-status.json << EOF
          {
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "jobs": {
              "validate-agents": "${{ needs.validate-agents.result }}",
              "lint": "${{ needs.lint.result }}",
              "bench": "${{ needs.bench.result }}",
              "version-check": "${{ needs.version-check.result }}",
              "quality-gate": "${{ needs.quality-gate.result }}"
            },
            "overall": "${{ job.status }}"
          }
          EOF

      - name: Update CI summary markdown
        run: |
          status_symbol() {
            case "$1" in
              success) echo "✅ success" ;;
              skipped) echo "⚪ skipped" ;;
              failure) echo "❌ failed" ;;
              cancelled) echo "🚫 cancelled" ;;
              *) echo "❓ $1" ;;
            esac
          }

          STATUS_VALIDATE_AGENTS=$(status_symbol "${{ needs.validate-agents.result }}")
          STATUS_LINT=$(status_symbol "${{ needs.lint.result }}")
          STATUS_BENCH=$(status_symbol "${{ needs.bench.result }}")
          STATUS_VERSION_CHECK=$(status_symbol "${{ needs.version-check.result }}")
          STATUS_QUALITY_GATE=$(status_symbol "${{ needs.quality-gate.result }}")

          cat > .agents/ci/ci-summary.md << EOF
          # CI Status Summary

          **Last updated:** $(date -u +%Y-%m-%dT%H:%M:%SZ)
          **Commit:** ${{ github.sha }}
          **Branch:** ${{ github.ref_name }}

          ## Job Results

          | Job | Status |
          |---|---|
          | validate-agents | $STATUS_VALIDATE_AGENTS |
          | lint | $STATUS_LINT |
          | bench | $STATUS_BENCH |
          | version-check | $STATUS_VERSION_CHECK |
          | quality-gate | $STATUS_QUALITY_GATE |

          ## Known Issues
          - None

          ## Flaky Tests
          - None detected in last 10 runs
          EOF
          cat .agents/ci/ci-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CI status as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-status
          path: |
            .agents/ci/ci-status.json
            .agents/ci/ci-summary.md

      - name: Check all required jobs passed or legitimately skipped
        run: |
          cat << 'EOF' | bash ./scripts/ci-required-evaluate.sh
          {
            "event_name": "${{ github.event_name }}",
            "changes_result": "${{ needs.changes.result }}",
            "changes": {
              "code": "${{ needs.changes.outputs.code }}",
              "docs": "${{ needs.changes.outputs.docs }}",
              "heavy": "${{ needs.changes.outputs.heavy }}",
              "agents": "${{ needs.changes.outputs.agents }}",
              "workflows": "${{ needs.changes.outputs.workflows }}"
            },
            "maintenance": {
              "maintenance_only": "${{ needs.quality-gate.outputs.maintenance_only }}",
              "source": "classifier"
            },
            "jobs": {
              "validate-agents": "${{ needs.validate-agents.result }}",
              "lint": "${{ needs.lint.result }}",
              "bench": "${{ needs.bench.result }}",
              "version-check": "${{ needs.version-check.result }}",
              "quality-gate": "${{ needs.quality-gate.result }}"
            }
          }
          EOF
