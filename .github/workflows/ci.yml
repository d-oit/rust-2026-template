---
# .github/workflows/ci.yml
# 2026 Best Practice Rust CI Pipeline
# Runs on: push to main/develop, all PRs
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Reduce cargo index update noise
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  # Enable sccache for faster builds
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────
  lint:
    name: Lint (YAML, Markdown, Commits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install yamllint
        run: sudo apt-get update && sudo apt-get install -y yamllint
      - name: YAML Lint
        run: yamllint .
      - name: Markdown Lint
        uses: davidanson/markdownlint-cli2-action@v19
        with:
          globs: "**/*.md"
      - name: Commitlint
        if: >
          github.event_name == 'pull_request' &&
          !endsWith(github.actor, '[bot]') &&
          github.event.sender.type != 'Bot'
        uses: wagoid/commitlint-github-action@v6

  # ───────────────────────────────────────────────────
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './scripts'
          severity: warning

  gitleaks:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ───────────────────────────────────────────────────
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  # ───────────────────────────────────────────────────
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Enable sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Install mold linker
        run: |
          sudo apt-get update
          sudo apt-get install -y mold
      - name: Clippy (all targets, all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # ───────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # Uncomment for cross-platform CI:
        # os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Enable sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Install mold linker
        run: |
          sudo apt-get update
          sudo apt-get install -y mold
      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Build workspace
        run: cargo build --workspace --all-features
      - name: Generate coverage report
        run: cargo llvm-cov nextest --workspace --all-features --profile ci --lcov --output-path lcov.info
      - name: Run doc tests
        run: cargo test --workspace --doc
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./lcov.info
          fail_ci_if_error: false

  # ───────────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Enable sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      - name: Generate lockfile
        run: cargo generate-lockfile
      - name: Run cargo audit
        run: cargo audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ───────────────────────────────────────────────────
  deny:
    name: Dependency Policy (cargo-deny)
    runs-on: ubuntu-latest
    # Disable sccache globally for this job - cargo-deny action runs in Docker without sccache
    env:
      RUSTC_WRAPPER: ""
      SCCACHE_GHA_ENABLED: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2

  # ───────────────────────────────────────────────────
  # Minimal versions check - ensures deps work with oldest allowed versions
  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.87
      - uses: Swatinem/rust-cache@v2
      - name: Enable sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Install mold linker
        run: |
          sudo apt-get update
          sudo apt-get install -y mold
      - name: Check MSRV
        run: cargo check --workspace

  # ───────────────────────────────────────────────────
  # Final gate - must pass for merge
  ci-success:
    name: CI Success
    needs: [lint, shellcheck, gitleaks, fmt, clippy, test, security, deny, msrv]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[  "${{ needs.lint.result }}" != "success" ||
                 "${{ needs.shellcheck.result }}" != "success" ||
                 "${{ needs.gitleaks.result }}" != "success" ||
                 "${{ needs.fmt.result }}" != "success" ||
                 "${{ needs.clippy.result }}" != "success" ||
                 "${{ needs.test.result }}" != "success" ||
                 "${{ needs.security.result }}" != "success" ||
                 "${{ needs.deny.result }}" != "success" ||
                 "${{ needs.msrv.result }}" != "success" ]]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
          echo "All CI jobs passed!"
