---
# .github/workflows/ci.yml
# 2026 Best Practice Rust CI Pipeline
# Runs on: push to main/develop, all PRs
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Reduce cargo index update noise
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  # Enable sccache for faster builds
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────
  lint:
    name: Lint (YAML, Markdown, Commits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Install yamllint
        run: sudo apt-get update && sudo apt-get install -y yamllint
      - name: YAML Lint
        run: yamllint .
      - name: Markdown Lint
        uses: davidanson/markdownlint-cli2-action@v19
        with:
          globs: "**/*.md"
      - name: Validate agent metrics schema
        run: |
          if [ -f .agents/metrics.jsonl ]; then
            while IFS= read -r line; do
              if [ -n "$line" ]; then
                echo "$line" | python3 -c "
          import sys, json
          try:
              d = json.load(sys.stdin)
              required = ['timestamp','agent','skill','success']
              for f in required:
                  assert f in d, f'Missing field: {f}'
          except Exception as e:
              print(f'Validation failed: {e}')
              sys.exit(1)
          " || exit 1
              fi
            done < .agents/metrics.jsonl
            echo "Agent metrics validation OK"
          fi
      - name: Commitlint
        if: >
          github.event_name == 'pull_request' &&
          !endsWith(github.actor, '[bot]') &&
          github.event.sender.type != 'Bot'
        uses: wagoid/commitlint-github-action@v6

  # ───────────────────────────────────────────────────
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './scripts'
          severity: warning

  gitleaks:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ───────────────────────────────────────────────────
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  # ───────────────────────────────────────────────────
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Enable sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Install mold linker
        run: |
          sudo apt-get update
          sudo apt-get install -y mold
      - name: Clippy (all targets, all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # ───────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # Uncomment for cross-platform CI:
        # os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Enable sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Install mold linker
        run: |
          sudo apt-get update
          sudo apt-get install -y mold
      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Build workspace
        run: cargo build --workspace --all-features
      - name: Generate coverage report
        run: cargo llvm-cov nextest --workspace --all-features --profile ci --lcov --output-path lcov.info
      - name: Run doc tests
        run: cargo test --workspace --doc
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./lcov.info
          fail_ci_if_error: false

  # ───────────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Enable sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      - name: Generate lockfile
        run: cargo generate-lockfile
      - name: Run cargo audit
        run: cargo audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ───────────────────────────────────────────────────
  deny:
    name: Dependency Policy (cargo-deny)
    runs-on: ubuntu-latest
    # Disable sccache globally for this job - cargo-deny action runs in Docker without sccache
    env:
      RUSTC_WRAPPER: ""
      SCCACHE_GHA_ENABLED: "false"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: EmbarkStudios/cargo-deny-action@v2

  # ───────────────────────────────────────────────────
  # Benchmarks run and record history
  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Enable sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Install mold linker
        run: |
          sudo apt-get update
          sudo apt-get install -y mold
      - name: Run benchmarks
        run: cargo bench --workspace -- --output-format bencher 2>&1 | tee bench-output.txt
      - name: Parse and append bench results
        run: |
          python3 scripts/parse_bench.py bench-output.txt \
            ${{ github.sha }} $(date -u +%Y-%m-%dT%H:%M:%SZ) \
            >> benchmarks/history.jsonl
      - name: Upload benchmark history
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: benchmark-history
          path: benchmarks/history.jsonl

  # ───────────────────────────────────────────────────
  # VERSION consistency check
  version-check:
    name: VERSION consistency check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Check VERSION matches Cargo.toml
        run: |
          VERSION=$(cat VERSION)
          CARGO_VERSION=$(awk '
            /^\[workspace\.package\]/ { in_section=1; next }
            /^\[/                     { in_section=0 }
            in_section && /^version[[:space:]]*=/ {
              match($0, /"([0-9]+\.[0-9]+\.[0-9]+)"/, arr)
              if (arr[1] != "") { print arr[1]; exit }
            }
          ' Cargo.toml)
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "VERSION mismatch: VERSION=$VERSION, Cargo.toml=$CARGO_VERSION"
            exit 1
          fi
          echo "VERSION ($VERSION) matches Cargo.toml"
      - name: Check llms.txt is current
        run: |
          bash scripts/generate-llms-txt.sh
          git diff --exit-code llms.txt || (echo "llms.txt is stale, run scripts/generate-llms-txt.sh" && exit 1)

  # ───────────────────────────────────────────────────
  # Minimal versions check - ensures deps work with oldest allowed versions
  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: dtolnay/rust-toolchain@1.87
      - uses: Swatinem/rust-cache@v2
      - name: Enable sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Install mold linker
        run: |
          sudo apt-get update
          sudo apt-get install -y mold
      - name: Check MSRV
        run: cargo check --workspace

  # ───────────────────────────────────────────────────
  # Final gate - must pass for merge
  ci-success:
    name: CI Success
    needs: [lint, shellcheck, gitleaks, fmt, clippy, test, security, deny, bench, version-check, msrv]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Download benchmark history
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: benchmark-history
          path: benchmark-history-artifact
        continue-on-error: true

      - name: Sync benchmark history
        run: |
          if [ -f benchmark-history-artifact/history.jsonl ]; then
            cp benchmark-history-artifact/history.jsonl benchmarks/history.jsonl
          fi

      - name: Write CI status summary
        run: |
          cat > ci-status.json << EOF
          {
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "jobs": {
              "lint": "${{ needs.lint.result }}",
              "shellcheck": "${{ needs.shellcheck.result }}",
              "gitleaks": "${{ needs.gitleaks.result }}",
              "fmt": "${{ needs.fmt.result }}",
              "clippy": "${{ needs.clippy.result }}",
              "test": "${{ needs.test.result }}",
              "security": "${{ needs.security.result }}",
              "deny": "${{ needs.deny.result }}",
              "bench": "${{ needs.bench.result }}",
              "version-check": "${{ needs.version-check.result }}",
              "msrv": "${{ needs.msrv.result }}"
            },
            "overall": "${{ job.status }}"
          }
          EOF

      - name: Update CI summary markdown
        run: |
          STATUS_LINT="${{ needs.lint.result == 'success' && '✅ success' || '❌ failed' }}"
          STATUS_TEST="${{ needs.test.result == 'success' && '✅ success' || '❌ failed' }}"
          STATUS_SECURITY="${{ needs.security.result == 'success' && '✅ success' || '❌ failed' }}"
          STATUS_BENCH="${{ needs.bench.result == 'success' && '✅ success' || '❌ failed' }}"

          cat > ci-summary.md << EOF
          # CI Status Summary

          **Last updated:** $(date -u +%Y-%m-%dT%H:%M:%SZ)
          **Commit:** ${{ github.sha }}
          **Branch:** ${{ github.ref_name }}

          ## Job Results

          | Job | Status |
          |---|---|
          | lint | $STATUS_LINT |
          | test | $STATUS_TEST |
          | security | $STATUS_SECURITY |
          | bench | $STATUS_BENCH |

          ## Known Issues
          - None

          ## Flaky Tests
          - None detected in last 10 runs
          EOF

      - name: Upload CI status as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-status
          path: |
            ci-status.json
            ci-summary.md

      - name: Persist CI data to main
        if: github.ref == 'refs/heads/main' && always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ci-summary.md benchmarks/history.jsonl ci-status.json
          git commit -m "chore: update CI status and benchmark history [skip ci]" || true
          git push origin main
        continue-on-error: true

      - name: Check all jobs passed
        run: |
          if [[  "${{ needs.lint.result }}" != "success" ||
                 "${{ needs.shellcheck.result }}" != "success" ||
                 "${{ needs.gitleaks.result }}" != "success" ||
                 "${{ needs.fmt.result }}" != "success" ||
                 "${{ needs.clippy.result }}" != "success" ||
                 "${{ needs.test.result }}" != "success" ||
                 "${{ needs.security.result }}" != "success" ||
                 "${{ needs.deny.result }}" != "success" ||
                 "${{ needs.bench.result }}" != "success" ||
                 "${{ needs.version-check.result }}" != "success" ||
                 "${{ needs.msrv.result }}" != "success" ]]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
          echo "All CI jobs passed!"
