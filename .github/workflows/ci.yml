---
# .github/workflows/ci.yml
# 2026 Best Practice Rust CI Pipeline
# Runs on: push to main/develop, all PRs
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  # Disable incremental compilation in CI to reduce I/O overhead.
  CARGO_INCREMENTAL: 0
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────
  # Path filtering to optimize CI execution
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      heavy: ${{ steps.filter.outputs.heavy }}
      agents: ${{ steps.filter.outputs.agents }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad  # v3.0.4
        id: filter
        with:
          filters: |
            code:
              - 'crates/**'
              - 'src/**'
              - 'examples/**'
              - 'tests/**'
              - 'benchmarks/**'
              - 'fuzz/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
            heavy:
              - 'crates/**'
              - 'src/**'
              - 'examples/**'
              - 'benchmarks/**'
              - 'fuzz/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
            agents:
              - 'AGENTS.md'
              - 'CLAUDE.md'
              - 'GEMINI.md'
              - 'QWEN.md'
              - 'agents-docs/**'
              - '.agents/skills/**'
              - '.agents/SKILLS.md'
              - '.agents/agent-adapters.toml'
              - 'schema/agent-adapters.schema.json'
              - 'scripts/validate-agent-entrypoints.sh'
              - 'scripts/generate-skills-md.sh'
            workflows:
              - '.github/workflows/**'

  # ───────────────────────────────────────────────────
  validate-agents:
    name: Validate Agent Entrypoints
    needs: [changes]
    if: >
      github.event_name != 'pull_request' ||
      needs.changes.outputs.agents == 'true' ||
      needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3  # v2
      - name: Run agent validator
        run: ./scripts/validate-agent-entrypoints.sh
      - name: Validate adapter manifest
        run: cargo run --quiet -p xtask --bin xtask -- agents validate
        env:
          RUSTC_WRAPPER: ""

  # ───────────────────────────────────────────────────
  lint:
    name: Lint (YAML, Markdown, Commits)
    needs: [changes]
    if: >
      github.event_name != 'pull_request' ||
      needs.changes.outputs.code == 'true' ||
      needs.changes.outputs.agents == 'true' ||
      needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Install yamllint
        run: sudo apt-get update && sudo apt-get install -y yamllint
      - name: YAML Lint
        run: yamllint .
      - name: Check for placeholder values
        continue-on-error: true
        run: |
          if grep -rE 'your-org|Your Name|your-repo|your-crate' Cargo.toml; then
            echo "::warning::Placeholder values found in Cargo.toml. Run init-template.sh first."
          fi
      - name: Markdown Lint
        uses: davidanson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24
        with:
          globs: "**/*.md"
      - name: Validate agent metrics schema
        run: |
          if [ -f .agents/metrics.jsonl ]; then
            while IFS= read -r line; do
              if [ -n "$line" ]; then
                echo "$line" | python3 -c "
          import sys, json
          try:
              d = json.load(sys.stdin)
              required = ['timestamp','agent','skill','success']
              for f in required:
                  assert f in d, f'Missing field: {f}'
          except Exception as e:
              print(f'Validation failed: {e}')
              sys.exit(1)
          " || exit 1
              fi
            done < .agents/metrics.jsonl
            echo "Agent metrics validation OK"
          fi
      # Commitlint is enforced via dedicated .github/workflows/commitlint.yml

  # ───────────────────────────────────────────────────
  shellcheck:
    name: ShellCheck
    needs: [changes]
    if: >
      github.event_name != 'pull_request' ||
      needs.changes.outputs.code == 'true' ||
      needs.changes.outputs.agents == 'true' ||
      needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca  # master
        with:
          scandir: './scripts'
          severity: warning

  gitleaks:
    name: Secret Scan (Gitleaks)
    needs: [changes]
    if: >
      github.event_name != 'pull_request' ||
      needs.changes.outputs.code == 'true' ||
      needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ───────────────────────────────────────────────────
  fmt:
    name: Format
    needs: [changes]
    if: >
      github.event_name != 'pull_request' ||
      needs.changes.outputs.code == 'true' ||
      needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          components: rustfmt
      - name: Run rustfmt
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    needs: [changes]
    if: >
      github.event_name != 'pull_request' ||
      needs.changes.outputs.code == 'true' ||
      needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          components: clippy
      - uses: ./.github/actions/setup-rust
        # Clippy is the only job where a failed run can poison the cache
        # with stale `.fingerprint/` metadata. Disable cache-on-failure
        # only for this job; other jobs keep the safe `true` default.
        with:
          cache-on-failure: false
      # `cargo clean -p` only removes compiled artifacts, NOT the
      # `.fingerprint/` directory that Rust 1.66+ uses to cache and replay
      # clippy diagnostics for example/test targets that have been removed.
      # Wipe the root crate's fingerprint entries; cargo will rebuild just
      # the root crate's metadata, leaving dependency caches intact.
      - name: Clear stale root-crate fingerprint metadata
        continue-on-error: true
        run: |
          set -x
          find target/.fingerprint -maxdepth 1 -name 'rust-2026-template-*' -print -delete || true
      - name: Clippy (all targets, all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # ───────────────────────────────────────────────────
  test:
    name: Test
    needs: [changes]
    if: >
      github.event_name != 'pull_request' ||
      needs.changes.outputs.code == 'true' ||
      needs.changes.outputs.workflows == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          components: llvm-tools-preview
      - uses: ./.github/actions/setup-rust
      - name: Install cargo-nextest and llvm-cov
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d  # v2
        with:
          tool: cargo-nextest,cargo-llvm-cov
      - name: Build workspace
        run: cargo build --workspace --all-features --profile ci
      - name: Generate coverage report
        run: cargo llvm-cov nextest --workspace --all-features --profile ci --lcov --output-path lcov.info
      - name: Run doc tests
        run: cargo test --workspace --doc
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./lcov.info
          fail_ci_if_error: false

  # ───────────────────────────────────────────────────
  security:
    name: Security Audit
    needs: [changes]
    if: >
      github.event_name != 'pull_request' ||
      needs.changes.outputs.code == 'true' ||
      needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - uses: ./.github/actions/setup-rust
      - name: Install cargo-audit
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d  # v2
        with:
          tool: cargo-audit
      - name: Generate lockfile
        run: cargo generate-lockfile
      - name: Run cargo audit
        run: cargo audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ───────────────────────────────────────────────────
  deny:
    name: Dependency Policy (cargo-deny)
    needs: [changes]
    if: >
      github.event_name != 'pull_request' ||
      needs.changes.outputs.code == 'true' ||
      needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: ""
      SCCACHE_GHA_ENABLED: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25  # v2

  # ───────────────────────────────────────────────────
  bench:
    name: Benchmarks
    needs: [changes]
    if: >
      github.event_name != 'pull_request' ||
      needs.changes.outputs.heavy == 'true' ||
      needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - uses: ./.github/actions/setup-rust
      - name: Run benchmarks
        run: cargo bench --workspace -- --output-format bencher 2>&1 | tee bench-output.txt
      - name: Parse and save bench results
        run: |
          BENCH_DIR="benchmarks/events/$(date -u +%Y/%m/%d)"
          mkdir -p "${BENCH_DIR}"
          python3 scripts/parse_bench.py bench-output.txt \
            ${{ github.sha }} $(date -u +%Y-%m-%dT%H:%M:%SZ) \
            > "${BENCH_DIR}/${{ github.sha }}.jsonl"
      - name: Upload benchmark events
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: benchmark-events
          path: benchmarks/events/

  # ───────────────────────────────────────────────────
  version-check:
    name: VERSION consistency check
    needs: [changes]
    if: >
      github.event_name != 'pull_request' ||
      needs.changes.outputs.code == 'true' ||
      needs.changes.outputs.agents == 'true' ||
      needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check VERSION matches Cargo.toml
        run: bash scripts/propagate-version.sh --check
      - name: Check llms.txt is current
        run: |
          bash scripts/generate-llms-txt.sh
          git diff --exit-code llms.txt || (echo "llms.txt is stale, run scripts/generate-llms-txt.sh" && exit 1)
      - name: Check .agents/SKILLS.md is current
        run: |
          bash scripts/generate-skills-md.sh
          MSG="regenerate with scripts/generate-skills-md.sh"
          git diff --exit-code .agents/SKILLS.md \
            || (echo ".agents/SKILLS.md is stale, ${MSG}" && exit 1)

  # ───────────────────────────────────────────────────
  msrv:
    name: MSRV Check
    needs: [changes]
    if: >
      github.event_name != 'pull_request' ||
      needs.changes.outputs.heavy == 'true' ||
      needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: "1.88"
      - uses: ./.github/actions/setup-rust
      - name: Check MSRV
        run: cargo check --workspace

  # ───────────────────────────────────────────────────
  roast:
    name: Roast Scorer
    needs:
      - validate-agents
      - lint
      - shellcheck
      - gitleaks
      - fmt
      - clippy
      - test
      - security
      - deny
      - bench
      - version-check
      - msrv
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - uses: ./.github/actions/setup-rust
      - name: Run Roast Scorer
        run: ./scripts/roast-scorer.sh
      - name: Upload Roast Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: roast-report
          path: reports/roast-report.json

  # ───────────────────────────────────────────────────
  # Config-driven verification (issue #285): which checks run per trigger is decided by
  # config/xtask.json — not by magic values in this YAML. PRs run the fast `pull-request`
  # tier; pushes to protected branches run the deep `protected-branch` tier. The GHA job
  # summary also prints the resolved plan for every configured tier.
  quality-gate:
    name: Quality Gate (${{ github.event_name == 'pull_request' && 'pull-request' || 'protected-branch' }})
    needs: [changes]
    if: >
      github.event_name != 'pull_request' ||
      needs.changes.outputs.code == 'true' ||
      needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - uses: ./.github/actions/setup-rust
      - name: Install verification tooling
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d  # v2
        with:
          tool: cargo-nextest,cargo-audit,cargo-deny,cargo-machete
      - name: Install shellcheck and markdownlint
        run: |
          sudo apt-get install -y shellcheck
          npm install -g markdownlint-cli2
      - name: Publish configured verification tiers
        run: |
          echo "### Verification tiers (config/xtask.json)" >> "$GITHUB_STEP_SUMMARY"
          for tier in pull-request protected-branch scheduled release; do
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "#### Tier \`$tier\`" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cargo run --quiet -p xtask --bin xtask -- quality plan --tier "$tier" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Run trigger tier
        run: |
          TIER=pull-request
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            TIER=protected-branch
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          echo "Running config-driven quality tier: $TIER"
          if [ -n "$BASE" ]; then
            cargo run --quiet -p xtask --bin xtask -- quality run --tier "$TIER" --changed-from "$BASE"
          else
            cargo run --quiet -p xtask --bin xtask -- quality run --tier "$TIER"
          fi
      - name: Upload CI telemetry
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-telemetry
          path: .agents/ci/quality-run.json
          if-no-files-found: warn

  # ───────────────────────────────────────────────────
  ci-success:
    name: CI Success
    needs:
      - validate-agents
      - lint
      - shellcheck
      - gitleaks
      - fmt
      - clippy
      - test
      - security
      - deny
      - bench
      - version-check
      - msrv
      - roast
      - quality-gate
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: write  # needed to persist CI status files to main
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download benchmark events
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v4
        with:
          name: benchmark-events
          path: benchmarks/events
        continue-on-error: true

      - name: Write CI status summary
        run: |
          mkdir -p .agents/aggregated
          cat > .agents/ci/ci-status.json << EOF
          {
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "jobs": {
              "validate-agents": "${{ needs.validate-agents.result }}",
              "lint": "${{ needs.lint.result }}",
              "shellcheck": "${{ needs.shellcheck.result }}",
              "gitleaks": "${{ needs.gitleaks.result }}",
              "fmt": "${{ needs.fmt.result }}",
              "clippy": "${{ needs.clippy.result }}",
              "test": "${{ needs.test.result }}",
              "security": "${{ needs.security.result }}",
              "deny": "${{ needs.deny.result }}",
              "bench": "${{ needs.bench.result }}",
              "version-check": "${{ needs.version-check.result }}",
            "msrv": "${{ needs.msrv.result }}",
            "roast": "${{ needs.roast.result }}"
            },
            "overall": "${{ job.status }}"
          }
          EOF

      - name: Update CI summary markdown
        run: |
          if [[ "${{ needs.lint.result }}" == "success" || "${{ needs.lint.result }}" == "skipped" ]]; then
            STATUS_LINT="✅ success"
          else
            STATUS_LINT="❌ failed"
          fi
          if [[ "${{ needs.test.result }}" == "success" || "${{ needs.test.result }}" == "skipped" ]]; then
            STATUS_TEST="✅ success"
          else
            STATUS_TEST="❌ failed"
          fi
          if [[ "${{ needs.security.result }}" == "success" || "${{ needs.security.result }}" == "skipped" ]]; then
            STATUS_SECURITY="✅ success"
          else
            STATUS_SECURITY="❌ failed"
          fi
          if [[ "${{ needs.bench.result }}" == "success" || "${{ needs.bench.result }}" == "skipped" ]]; then
            STATUS_BENCH="✅ success"
          else
            STATUS_BENCH="❌ failed"
          fi
          if [[ "${{ needs.roast.result }}" == "success" || "${{ needs.roast.result }}" == "skipped" ]]; then
            STATUS_ROAST="✅ success"
          else
            STATUS_ROAST="❌ failed"
          fi

          cat > .agents/ci/ci-summary.md << EOF
          # CI Status Summary

          **Last updated:** $(date -u +%Y-%m-%dT%H:%M:%SZ)
          **Commit:** ${{ github.sha }}
          **Branch:** ${{ github.ref_name }}

          ## Job Results

          | Job | Status |
          |---|---|
          | lint | $STATUS_LINT |
          | test | $STATUS_TEST |
          | security | $STATUS_SECURITY |
          | bench | $STATUS_BENCH |
          | roast | $STATUS_ROAST |

          ## Known Issues
          - None

          ## Flaky Tests
          - None detected in last 10 runs
          EOF

      - name: Upload CI status as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-status
          path: |
            .agents/ci/ci-status.json
            .agents/ci/ci-summary.md

      - name: Persist CI data to main
        if: github.ref == 'refs/heads/main' && always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .agents/ci/ benchmarks/events/
          git commit -m "chore: update CI status and benchmark events [skip ci]" || true
          git push origin main
        continue-on-error: true

      - name: Check all jobs passed
        run: |
          results=(
            "${{ needs.validate-agents.result }}"
            "${{ needs.lint.result }}"
            "${{ needs.shellcheck.result }}"
            "${{ needs.gitleaks.result }}"
            "${{ needs.fmt.result }}"
            "${{ needs.clippy.result }}"
            "${{ needs.test.result }}"
            "${{ needs.security.result }}"
            "${{ needs.deny.result }}"
            "${{ needs.bench.result }}"
            "${{ needs.version-check.result }}"
            "${{ needs.msrv.result }}"
            "${{ needs.roast.result }}"
            "${{ needs.quality-gate.result }}"
          )
          for res in "${results[@]}"; do
            if [[ "$res" == "failure" || "$res" == "cancelled" ]]; then
              echo "One or more critical CI jobs failed or were cancelled"
              exit 1
            fi
          done
          echo "All CI jobs passed or were correctly skipped!"
