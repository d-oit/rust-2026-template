---
# .github/workflows/ci.yml
# 2026 Best Practice Rust CI Pipeline
# Runs on: push to main/develop, all PRs
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────
  # Path filtering to optimize CI execution
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      heavy: ${{ steps.filter.outputs.heavy }}
      agents: ${{ steps.filter.outputs.agents }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d  # v4.0.1
        id: filter
        with:
          filters: |
            code:
              - 'crates/**'
              - 'src/**'
              - 'examples/**'
              - 'tests/**'
              - 'benchmarks/**'
              - 'fuzz/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
            heavy:
              - 'crates/**'
              - 'src/**'
              - 'examples/**'
              - 'benchmarks/**'
              - 'fuzz/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
            agents:
              - 'AGENTS.md'
              - 'CLAUDE.md'
              - 'GEMINI.md'
              - 'QWEN.md'
              - 'agents-docs/**'
              - 'scripts/validate-agent-entrypoints.sh'
            workflows:
              - '.github/workflows/**'

  # ───────────────────────────────────────────────────
  validate-agents:
    name: Validate Agent Entrypoints
    needs: [changes]
    if: >
      github.event_name != 'pull_request' ||
      needs.changes.outputs.agents == 'true' ||
      needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Run agent validator
        run: ./scripts/validate-agent-entrypoints.sh

  # ───────────────────────────────────────────────────
  lint:
    name: Lint (YAML, Markdown, Commits)
    needs: [changes]
    if: >
      github.event_name != 'pull_request' ||
      needs.changes.outputs.code == 'true' ||
      needs.changes.outputs.agents == 'true' ||
      needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Install yamllint
        run: sudo apt-get update && sudo apt-get install -y yamllint
      - name: YAML Lint
        run: yamllint .
      - name: Markdown Lint
        uses: davidanson/markdownlint-cli2-action@v19
        with:
          globs: "**/*.md"
      - name: Validate agent metrics schema
        run: |
          if [ -f .agents/metrics.jsonl ]; then
            while IFS= read -r line; do
              if [ -n "$line" ]; then
                echo "$line" | python3 -c "
          import sys, json
          try:
              d = json.load(sys.stdin)
              required = ['timestamp','agent','skill','success']
              for f in required:
                  assert f in d, f'Missing field: {f}'
          except Exception as e:
              print(f'Validation failed: {e}')
              sys.exit(1)
          " || exit 1
              fi
            done < .agents/metrics.jsonl
            echo "Agent metrics validation OK"
          fi
      - name: Commitlint
        if: >
          github.event_name == 'pull_request' &&
          !contains(github.actor, '[bot]')
        uses: wagoid/commitlint-github-action@v6

  # ───────────────────────────────────────────────────
  shellcheck:
    name: ShellCheck
    needs: [changes]
    if: >
      github.event_name != 'pull_request' ||
      needs.changes.outputs.code == 'true' ||
      needs.changes.outputs.agents == 'true' ||
      needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './scripts'
          severity: warning

  gitleaks:
    name: Secret Scan (Gitleaks)
    needs: [changes]
    if: >
      github.event_name != 'pull_request' ||
      needs.changes.outputs.code == 'true' ||
      needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ───────────────────────────────────────────────────
  fmt:
    name: Format
    needs: [changes]
    if: >
      github.event_name != 'pull_request' ||
      needs.changes.outputs.code == 'true' ||
      needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          components: rustfmt
      - name: Run rustfmt
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    needs: [changes]
    if: >
      github.event_name != 'pull_request' ||
      needs.changes.outputs.code == 'true' ||
      needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae  # v2
        with:
          cache-on-failure: true
      - name: Enable sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Install mold linker
        run: |
          sudo apt-get update
          sudo apt-get install -y mold
      - name: Clippy (all targets, all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # ───────────────────────────────────────────────────
  test:
    name: Test
    needs: [changes]
    if: >
      github.event_name != 'pull_request' ||
      needs.changes.outputs.code == 'true' ||
      needs.changes.outputs.workflows == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae  # v2
        with:
          cache-on-failure: true
      - name: Enable sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Install mold linker
        run: |
          sudo apt-get update
          sudo apt-get install -y mold
      - name: Install cargo-nextest and llvm-cov
        uses: taiki-e/install-action@e49978b799e49ff429d162b7a30601a569ab6538  # v2
        with:
          tool: cargo-nextest,cargo-llvm-cov
      - name: Build workspace
        run: cargo build --workspace --all-features
      - name: Generate coverage report
        run: cargo llvm-cov nextest --workspace --all-features --profile ci --lcov --output-path lcov.info
      - name: Run doc tests
        run: cargo test --workspace --doc
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./lcov.info
          fail_ci_if_error: false

  # ───────────────────────────────────────────────────
  security:
    name: Security Audit
    needs: [changes]
    if: >
      github.event_name != 'pull_request' ||
      needs.changes.outputs.code == 'true' ||
      needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae  # v2
        with:
          cache-on-failure: true
      - name: Enable sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Install cargo-audit
        uses: taiki-e/install-action@e49978b799e49ff429d162b7a30601a569ab6538  # v2
        with:
          tool: cargo-audit
      - name: Generate lockfile
        run: cargo generate-lockfile
      - name: Run cargo audit
        run: cargo audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ───────────────────────────────────────────────────
  deny:
    name: Dependency Policy (cargo-deny)
    needs: [changes]
    if: >
      github.event_name != 'pull_request' ||
      needs.changes.outputs.code == 'true' ||
      needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: ""
      SCCACHE_GHA_ENABLED: "false"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: EmbarkStudios/cargo-deny-action@v2

  # ───────────────────────────────────────────────────
  bench:
    name: Benchmarks
    needs: [changes]
    if: >
      github.event_name != 'pull_request' ||
      needs.changes.outputs.heavy == 'true' ||
      needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae  # v2
        with:
          cache-on-failure: true
      - name: Enable sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Install mold linker
        run: |
          sudo apt-get update
          sudo apt-get install -y mold
      - name: Run benchmarks
        run: cargo bench --workspace -- --output-format bencher 2>&1 | tee bench-output.txt
      - name: Parse and append bench results
        run: |
          python3 scripts/parse_bench.py bench-output.txt \
            ${{ github.sha }} $(date -u +%Y-%m-%dT%H:%M:%SZ) \
            >> benchmarks/history.jsonl
      - name: Upload benchmark history
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: benchmark-history
          path: benchmarks/history.jsonl

  # ───────────────────────────────────────────────────
  version-check:
    name: VERSION consistency check
    needs: [changes]
    if: >
      github.event_name != 'pull_request' ||
      needs.changes.outputs.code == 'true' ||
      needs.changes.outputs.agents == 'true' ||
      needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Check VERSION matches Cargo.toml
        run: |
          VERSION=$(cat VERSION)
          CARGO_VERSION=$(awk '
            /^\[workspace\.package\]/ { in_section=1; next }
            /^\[/                     { in_section=0 }
            in_section && /^version[[:space:]]*=/ {
              match($0, /"([0-9]+\.[0-9]+\.[0-9]+)"/, arr)
              if (arr[1] != "") { print arr[1]; exit }
            }
          ' Cargo.toml)
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "VERSION mismatch: VERSION=$VERSION, Cargo.toml=$CARGO_VERSION"
            exit 1
          fi
          echo "VERSION ($VERSION) matches Cargo.toml"
      - name: Check llms.txt is current
        run: |
          bash scripts/generate-llms-txt.sh
          git diff --exit-code llms.txt || (echo "llms.txt is stale, run scripts/generate-llms-txt.sh" && exit 1)

  # ───────────────────────────────────────────────────
  msrv:
    name: MSRV Check
    needs: [changes]
    if: >
      github.event_name != 'pull_request' ||
      needs.changes.outputs.heavy == 'true' ||
      needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae  # v2
      - name: Enable sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Install mold linker
        run: |
          sudo apt-get update
          sudo apt-get install -y mold
      - name: Check MSRV
        run: cargo check --workspace

  # ───────────────────────────────────────────────────
  ci-success:
    name: CI Success
    needs: [validate-agents, lint, shellcheck, gitleaks, fmt, clippy, test, security, deny, bench, version-check, msrv]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Download benchmark history
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: benchmark-history
          path: benchmark-history-artifact
        continue-on-error: true

      - name: Sync benchmark history
        run: |
          if [ -f benchmark-history-artifact/history.jsonl ]; then
            cp benchmark-history-artifact/history.jsonl benchmarks/history.jsonl
          fi

      - name: Write CI status summary
        run: |
          cat > ci-status.json << EOF
          {
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "jobs": {
              "validate-agents": "${{ needs.validate-agents.result }}",
              "lint": "${{ needs.lint.result }}",
              "shellcheck": "${{ needs.shellcheck.result }}",
              "gitleaks": "${{ needs.gitleaks.result }}",
              "fmt": "${{ needs.fmt.result }}",
              "clippy": "${{ needs.clippy.result }}",
              "test": "${{ needs.test.result }}",
              "security": "${{ needs.security.result }}",
              "deny": "${{ needs.deny.result }}",
              "bench": "${{ needs.bench.result }}",
              "version-check": "${{ needs.version-check.result }}",
              "msrv": "${{ needs.msrv.result }}"
            },
            "overall": "${{ job.status }}"
          }
          EOF

      - name: Update CI summary markdown
        run: |
          if [[ "${{ needs.lint.result }}" == "success" || "${{ needs.lint.result }}" == "skipped" ]]; then
            STATUS_LINT="✅ success"
          else
            STATUS_LINT="❌ failed"
          fi
          if [[ "${{ needs.test.result }}" == "success" || "${{ needs.test.result }}" == "skipped" ]]; then
            STATUS_TEST="✅ success"
          else
            STATUS_TEST="❌ failed"
          fi
          if [[ "${{ needs.security.result }}" == "success" || "${{ needs.security.result }}" == "skipped" ]]; then
            STATUS_SECURITY="✅ success"
          else
            STATUS_SECURITY="❌ failed"
          fi
          if [[ "${{ needs.bench.result }}" == "success" || "${{ needs.bench.result }}" == "skipped" ]]; then
            STATUS_BENCH="✅ success"
          else
            STATUS_BENCH="❌ failed"
          fi

          cat > ci-summary.md << EOF
          # CI Status Summary

          **Last updated:** $(date -u +%Y-%m-%dT%H:%M:%SZ)
          **Commit:** ${{ github.sha }}
          **Branch:** ${{ github.ref_name }}

          ## Job Results

          | Job | Status |
          |---|---|
          | lint | $STATUS_LINT |
          | test | $STATUS_TEST |
          | security | $STATUS_SECURITY |
          | bench | $STATUS_BENCH |

          ## Known Issues
          - None

          ## Flaky Tests
          - None detected in last 10 runs
          EOF

      - name: Upload CI status as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-status
          path: |
            ci-status.json
            ci-summary.md

      - name: Persist CI data to main
        if: github.ref == 'refs/heads/main' && always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ci-summary.md benchmarks/history.jsonl ci-status.json
          git commit -m "chore: update CI status and benchmark history [skip ci]" || true
          git push origin main
        continue-on-error: true

      - name: Check all jobs passed
        run: |
          results=(
            "${{ needs.validate-agents.result }}"
            "${{ needs.lint.result }}"
            "${{ needs.shellcheck.result }}"
            "${{ needs.gitleaks.result }}"
            "${{ needs.fmt.result }}"
            "${{ needs.clippy.result }}"
            "${{ needs.test.result }}"
            "${{ needs.security.result }}"
            "${{ needs.deny.result }}"
            "${{ needs.bench.result }}"
            "${{ needs.version-check.result }}"
            "${{ needs.msrv.result }}"
          )
          for res in "${results[@]}"; do
            if [[ "$res" == "failure" || "$res" == "cancelled" ]]; then
              echo "One or more critical CI jobs failed or were cancelled"
              exit 1
            fi
          done
          echo "All CI jobs passed or were correctly skipped!"
