---
# .github/workflows/eval.yml
# Periodic skill evaluation runner
name: Skill Evaluation

on:
  schedule:
    - cron: '0 10 * * 1'  # Weekly on Monday at 10am UTC
  pull_request:
    paths:
      - '.agents/skills/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval:
    name: Run Skill Evaluations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Run evals
        run: bash scripts/run-evals.sh --verbose

      - name: Save eval results
        if: github.event_name == 'schedule'
        run: |
          mkdir -p .agents/evals
          bash scripts/run-evals.sh --verbose > .agents/evals/$(date -u +%Y-%m-%d).txt 2>&1 || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .agents/evals/
          git diff --cached --quiet || git commit -m "chore: update skill eval results [skip ci]"
          git push
        continue-on-error: true
