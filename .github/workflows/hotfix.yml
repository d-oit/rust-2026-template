---
# .github/workflows/hotfix.yml
#
# Track hotfix events for Change Failure Rate (CFR) DORA metric.
# Records events when hotfix/rework PRs are merged or on hotfix/* branch pushes.

name: Hotfix Tracking

on:
  pull_request:
    types: [closed]
    branches: [main]
  push:
    branches:
      - 'hotfix/**'

jobs:
  track-hotfix:
    if: |
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       (contains(github.event.pull_request.labels.*.name, 'hotfix') ||
        contains(github.event.pull_request.labels.*.name, 'rework'))) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/hotfix/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read   # required for gh run list / gh run watch
    steps:
      - name: Record Hotfix Event
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        with:
          script: |
            const labels = context.payload.pull_request?.labels.map(l => l.name) || [];
            const type = labels.includes('rework') ? 'rework' : 'hotfix';

            const event = {
              date: new Date().toISOString().split('T')[0],
              metric: 'change_failure',
              type: type,
              pr: context.payload.pull_request?.number ?? null,
              branch: context.ref,
              triggered_by: context.actor,
            };

            console.log('Hotfix/Rework event recorded:', JSON.stringify(event));

            core.summary
              .addHeading('⚠️ Hotfix/Rework Detected')
              .addRaw(`This contribution is classified as a **${event.type}** ` +
                     `and will count toward the **Change Failure Rate** ` +
                     `DORA metric.`)
              .write();

            const fs = require('fs');
            fs.writeFileSync('dora-metrics.jsonl', JSON.stringify(event) + '\n');

      - name: Wait for CI on hotfix branch
        # Only applicable when triggered by a push to a hotfix branch
        # (not when triggered by a PR merge, where CI already ran)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Find the most recent CI run for this branch and wait for it
          RUN_ID=$(gh run list \
            --branch "${{ github.ref_name }}" \
            --workflow "ci.yml" \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "No CI run found for branch ${{ github.ref_name }} — skipping watch"
            exit 0
          fi

          echo "Watching CI run $RUN_ID for branch ${{ github.ref_name }}..."
          gh run watch "$RUN_ID" --exit-status
          echo "CI passed ✔ Hotfix branch is green."

      - name: Upload DORA Metrics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: dora-metrics-hotfix-${{ github.run_id }}
          path: dora-metrics.jsonl
