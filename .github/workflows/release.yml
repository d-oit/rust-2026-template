---
# .github/workflows/release.yml
# Automated release pipeline with cargo-dist
# Triggered by pushing a version tag: git tag v0.1.0 && git push --tags
name: Release

on:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"

jobs:
  # Cheap, read-only preflight: ensure tag matches tree VERSION and release does not already exist
  preflight:
    name: Release Preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify tag matches a declared version
        run: |
          # Two version sources exist by design:
          #   * VERSION                          - the adopter application version
          #   * .template/CHANGELOG-TEMPLATE.md  - the template's own meta-releases
          # VERSION intentionally stays 0.0.0 in the template (see AGENTS.md), so
          # checking VERSION alone rejected every template tag. Accept a tag that
          # matches either source and fail closed when it matches neither.
          TREE_VERSION="$(tr -d '[:space:]' < VERSION)"
          CHANGELOG=".template/CHANGELOG-TEMPLATE.md"
          TEMPLATE_VERSION=""
          if [[ -f "$CHANGELOG" ]]; then
            TEMPLATE_VERSION="$(grep -m1 -oE '^\[[0-9]+\.[0-9]+\.[0-9]+\]:' "$CHANGELOG" \
              | tr -d '[]:')"
          fi

          TAG="${GITHUB_REF_NAME}"
          if [[ -n "$TREE_VERSION" && "$TAG" == "v${TREE_VERSION}" ]]; then
            echo "✓ Tag '${TAG}' matches VERSION '${TREE_VERSION}'"
            exit 0
          fi
          if [[ -n "$TEMPLATE_VERSION" && "$TAG" == "v${TEMPLATE_VERSION}" ]]; then
            echo "✓ Tag '${TAG}' matches template release '${TEMPLATE_VERSION}'"
            exit 0
          fi

          echo "::error::Tag '${TAG}' matches no declared version."
          echo "VERSION: '${TREE_VERSION:-<missing>}' (expected tag 'v${TREE_VERSION}')"
          echo "Template changelog: '${TEMPLATE_VERSION:-<missing>}' (expected tag 'v${TEMPLATE_VERSION}')"
          exit 1
      - name: Verify release does not already exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "::error::GitHub Release for '${GITHUB_REF_NAME}' already exists! Aborting."
            exit 1
          fi
          echo "✓ Release '${GITHUB_REF_NAME}' does not exist yet."
      - name: Verify version consistency across manifests
        run: bash scripts/propagate-version.sh --check

  # Run the release-tier quality gates before building anything
  verify:
    name: Quality Gates (release tier)
    needs: [preflight]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
      - uses: ./.github/actions/setup-rust
      - name: Install verification tooling
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b  # v2
        with:
          tool: cargo-nextest,cargo-audit,cargo-deny,cargo-machete
      - name: Install shellcheck, yamllint, and markdownlint
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck yamllint
          npm install -g markdownlint-cli2
      - name: Install actionlint
        run: |
          ACTIONLINT_VERSION=1.7.12
          SCRIPT=https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash
          bash <(curl -fsSL "${SCRIPT}") "${ACTIONLINT_VERSION}" /usr/local/bin
          actionlint --version
      - name: Run release-tier quality gates
        run: ./scripts/quality-gates.sh --tier release

  # Resolve the explicit crates.io allowlist before touching the registry
  publish_plan:
    name: Resolve crates.io publish plan
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_packages: ${{ steps.plan.outputs.has_packages }}
      packages: ${{ steps.plan.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
      - name: Resolve publish allowlist
        id: plan
        run: python3 scripts/trustpub.py --root . release-plan >> "$GITHUB_OUTPUT"

  # Run 'dist plan' (or host) to determine what tasks we need to do
  plan:
    name: cargo-dist plan
    needs: [verify]
    runs-on: ubuntu-22.04
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ !github.event.pull_request && github.ref_name || '' }}
      tag-flag: ${{ !github.event.pull_request && format('--tag={0}', github.ref_name) || '' }}
      publishing: ${{ !github.event.pull_request }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install dist
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh
      - name: Cache dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist
      - id: plan
        run: |
          TAG_REF="${{ github.ref_name }}"
          IS_PR="${{ github.event.pull_request }}"
          if [ -z "$IS_PR" ]; then
            CMD="host --steps=create --tag=$TAG_REF"
          else
            CMD="plan"
          fi
          dist $CMD --output-format=json > plan-dist-manifest.json
          echo "dist ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: Upload dist-manifest.json
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  # Build and packages all the platform-specific things
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    needs: [plan]
    if: >-
      ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null &&
      (needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Rust non-interactively if not already installed
        if: ${{ matrix.container }}
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi
      - name: Install dist
        run: ${{ matrix.install_dist.run }}
      - name: Fetch local artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v4
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Install dependencies
        run: |
          ${{ matrix.packages_install }}
      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b  # v2
        with:
          tool: cargo-cyclonedx
      - name: Build artifacts
        run: |
          dist build ${{ needs.plan.outputs.tag-flag }} \
            --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
          echo "dist ran successfully"
      - id: cargo-dist
        name: Post-build
        shell: bash
        run: |
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          dist print-upload-files-from-manifest --manifest dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # Build and package all the platform-agnostic(ish) things
  build-global-artifacts:
    needs: [plan, build-local-artifacts]
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v4
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      - name: Fetch local artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v4
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        shell: bash
        run: |
          dist build ${{ needs.plan.outputs.tag-flag }} --output-format=json "--artifacts=global" > dist-manifest.json
          echo "dist ran successfully"

          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          jq --raw-output ".upload_files[]" dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # Determines if we should publish/announce and creates the release
  host:
    name: Create GitHub Release
    needs: [plan, build-local-artifacts, build-global-artifacts]
    if: >-
      ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.publishing == 'true' &&
      (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success') &&
      (needs.build-local-artifacts.result == 'skipped' || needs.build-local-artifacts.result == 'success') }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      val: ${{ steps.host.outputs.manifest }}
      release_type: ${{ steps.release-type.outputs.type }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Detect Release Type
        id: release-type
        run: |
          TAG_OR_BRANCH="${{ github.ref }}"
          MSG=$(git log --oneline -1)
          if [[ "$TAG_OR_BRANCH" == *"hotfix"* ]] || \
             echo "$MSG" | grep -qi 'hotfix\|regression\|critical'; then
            echo "type=hotfix" >> $GITHUB_OUTPUT
          else
            echo "type=regular" >> $GITHUB_OUTPUT
          fi
      - name: Install cached dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v4
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      - name: Fetch artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v4
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be  # v2
        with:
          subject-path: "target/distrib/*"
      - id: host
        shell: bash
        run: |
          dist host ${{ needs.plan.outputs.tag-flag }} \
            --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "artifacts uploaded and released successfully"
          cat dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: Upload dist-manifest.json
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: artifacts-dist-manifest
          path: dist-manifest.json
      - name: Download GitHub Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v4
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Cleanup
        run: |
          rm -f artifacts/*-dist-manifest.json
      - name: Create GitHub Release
        env:
          PRERELEASE_FLAG: >-
            ${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}
          ANNOUNCEMENT_TITLE: "${{ fromJson(steps.host.outputs.manifest).announcement_title }}"
          ANNOUNCEMENT_BODY: "${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}"
          RELEASE_COMMIT: "${{ github.sha }}"
        run: |
          echo "$ANNOUNCEMENT_BODY" > $RUNNER_TEMP/notes.txt
          gh release create "${{ needs.plan.outputs.tag }}" \
            --target "$RELEASE_COMMIT" $PRERELEASE_FLAG \
            --title "$ANNOUNCEMENT_TITLE" \
            --notes-file "$RUNNER_TEMP/notes.txt" artifacts/*

      - name: Record Release Metric
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const type = '${{ steps.release-type.outputs.type }}';
            const event = {
              date: new Date().toISOString().split('T')[0],
              metric: type === 'hotfix' ? 'change_failure' : 'deployment',
              release: context.ref.replace('refs/tags/', ''),
              type: type,
              triggered_by: context.actor,
            };

            const fs = require('fs');
            fs.writeFileSync('dora-metrics.jsonl', JSON.stringify(event) + '\n');

      - name: Upload DORA Metrics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: dora-metrics-release-${{ github.ref_name }}
          path: dora-metrics.jsonl

  # Publish the explicitly allowlisted crates after the GitHub Release exists.
  # Authentication uses GitHub OIDC; no long-lived crates.io token is stored.
  publish_crates:
    name: Publish to crates.io
    needs: [host, publish_plan]
    if: ${{ needs.publish_plan.outputs.has_packages == 'true' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9  # v1.0.6
      - name: Publish configured crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: python3 scripts/trustpub.py --root . release-publish

  post-release-check:
    name: Post-Release Health Check
    needs: [host]
    runs-on: ubuntu-latest
    permissions:
      # actions/checkout needs repository read access. Declaring any permission
      # sets every unlisted one to `none`, so `contents` must be explicit or the
      # checkout step cannot authenticate.
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3

      - name: Build release binary
        id: build
        run: cargo build --release --workspace

      - name: Smoke test - verify binary runs
        id: smoke
        run: |
          ./target/release/sample-app --version

      - name: Record FDRT start time on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILED_AT: ${{ github.event.head_commit.timestamp }}
        run: |
          envsubst < .github/ISSUE_TEMPLATE/release-failure.md > /tmp/issue-body.md
          URL=$(gh issue create \
            --title "🚨 Release ${RELEASE_TAG} failed post-release health check" \
            --label "hotfix,release-failure" \
            --body-file /tmp/issue-body.md)
          echo "::error::Post-release check failed. Issue created: $URL"
          exit 1
