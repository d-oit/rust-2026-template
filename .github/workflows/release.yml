---
# .github/workflows/release.yml
# Automated release pipeline with cargo-dist
# Triggered by pushing a version tag: git tag v0.1.0 && git push --tags
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write
  packages: write
  issues: write
  id-token: write  # for OIDC Trusted Publishing

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  # Run full CI first
  ci:
    uses: ./.github/workflows/ci.yml

  # Build release binaries and create GitHub Release using cargo-dist
  dist:
    name: Build and Release
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 0

      - name: Detect Release Type
        id: release-type
        run: |
          # Check if tag/branch or last commit message mentions hotfix/regression/critical
          TAG_OR_BRANCH="${{ github.ref }}"
          MSG=$(git log --oneline -1)
          if [[ "$TAG_OR_BRANCH" == *"hotfix"* ]] || \
             echo "$MSG" | grep -qi 'hotfix\|regression\|critical'; then
            echo "type=hotfix" >> $GITHUB_OUTPUT
          else
            echo "type=regular" >> $GITHUB_OUTPUT
          fi

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
      - name: Install cargo-dist
        uses: cargo-bins/cargo-binstall@732870f031d2fb36309d0deaf36abcc704a7be65  # main
      - run: cargo binstall cargo-dist --no-confirm
      - name: Run cargo-dist
        run: cargo dist build --tag ${{ github.ref_name }}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3
        with:
          files: target/distroot/**/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            ${{ steps.release-type.outputs.type == 'hotfix' &&
                '> ⚠️ **HOTFIX RELEASE** — counts toward Change Failure Rate' || '' }}

      - name: Record Release Metric
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        with:
          script: |
            const type = '${{ steps.release-type.outputs.type }}';
            const event = {
              date: new Date().toISOString().split('T')[0],
              metric: type === 'hotfix' ? 'change_failure' : 'deployment',
              release: context.ref.replace('refs/tags/', ''),
              type: type,
              triggered_by: context.actor,
            };

            const fs = require('fs');
            fs.writeFileSync('dora-metrics.jsonl', JSON.stringify(event) + '\n');

      - name: Upload DORA Metrics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: dora-metrics-release-${{ github.ref_name }}
          path: dora-metrics.jsonl

  # Publish to crates.io
  publish:
    name: Publish to crates.io
    needs: [dist]
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
      - name: Publish crate
        run: cargo publish --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Post-release health check (DORA FDRT)
  post-release-check:
    name: Post-Release Health Check
    needs: [publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          ref: ${{ github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2

      - name: Build release binary
        id: build
        run: cargo build --release --workspace

      - name: Smoke test - verify binary runs
        id: smoke
        run: |
          ./target/release/sample-app --version

      - name: Record FDRT start time on failure
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        with:
          script: |
            const tagName = "${{ github.ref_name }}";
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Release ${tagName} failed post-release health check`,
              body: [
                '## Release Health Check Failed',
                '',
                `**Release:** ${tagName}`,
                `**Failed at:** ${new Date().toISOString()}`,
                `**Workflow run:** ${context.serverUrl}/${context.repo.owner}/` +
                  `${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                '## Required Actions',
                '1. Identify the regression (check workflow logs above)',
                '2. Create a `hotfix/*` branch and fix the issue',
                '3. Record recovery time by closing this issue with a comment: `Recovered at: YYYY-MM-DDTHH:MM:SSZ`',
                '',
                '## DORA FDRT Tracking',
                'Time to detect: automatically recorded above.',
                'Time to recover: close this issue when the hotfix is deployed.',
                '',
                'Labels: `hotfix`, `release-failure`'
              ].join('\n'),
              labels: ['hotfix', 'release-failure'],
            });
            core.setFailed(`Post-release check failed. Issue created: ${issue.data.html_url}`);
