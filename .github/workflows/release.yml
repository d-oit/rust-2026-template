---
# .github/workflows/release.yml
# Automated release pipeline with cargo-dist
# Triggered by pushing a version tag: git tag v0.1.0 && git push --tags
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write
  packages: write
  id-token: write  # for OIDC Trusted Publishing

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  # Run full CI first
  ci:
    uses: ./.github/workflows/ci.yml

  # Build release binaries and create GitHub Release using cargo-dist
  dist:
    name: Build and Release
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect Release Type
        id: release-type
        run: |
          # Check if the tag or branch contains 'hotfix' or if the last commit message mentions it
          if [[ "${{ github.ref }}" == *"hotfix"* ]] || \
             git log --oneline -1 | grep -qi 'hotfix\|regression\|critical'; then
            echo "type=hotfix" >> $GITHUB_OUTPUT
            echo "Release type: hotfix"
          else
            echo "type=regular" >> $GITHUB_OUTPUT
            echo "Release type: regular"
          fi

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-dist
        uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall cargo-dist --no-confirm
      - name: Run cargo-dist
        run: cargo dist build --tag ${{ github.ref_name }}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: target/distroot/**/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            ${{ steps.release-type.outputs.type == 'hotfix' && '> ⚠️ **HOTFIX RELEASE** — counts toward Change Failure Rate' || '' }}

      - name: Record Release Metric
        uses: actions/github-script@v7
        with:
          script: |
            const event = {
              date: new Date().toISOString().split('T')[0],
              metric: '${{ steps.release-type.outputs.type == 'hotfix' && 'change_failure' || 'deployment' }}',
              release: context.ref.replace('refs/tags/', ''),
              type: '${{ steps.release-type.outputs.type }}',
              triggered_by: context.actor,
            };

            const fs = require('fs');
            fs.writeFileSync('dora-metrics.jsonl', JSON.stringify(event) + '\n');

      - name: Upload DORA Metrics
        uses: actions/upload-artifact@v4
        with:
          name: dora-metrics-release-${{ github.ref_name }}
          path: dora-metrics.jsonl

  # Publish to crates.io
  publish:
    name: Publish to crates.io
    needs: [dist]
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Publish crate
        run: cargo publish --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
