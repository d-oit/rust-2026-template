---
# .github/workflows/release.yml
# Automated release pipeline with cargo-dist
# Triggered by pushing a version tag: git tag v0.1.0 && git push --tags
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write
  packages: write
  issues: write
  id-token: write  # for OIDC Trusted Publishing

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  # Run full CI first
  ci:
    uses: ./.github/workflows/ci.yml

  # Build release binaries and create GitHub Release using cargo-dist
  dist:
    name: Build and Release
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v6
        with:
          fetch-depth: 0

      - name: Detect Release Type
        id: release-type
        run: |
          # Check if tag/branch or last commit message mentions hotfix/regression/critical
          TAG_OR_BRANCH="${{ github.ref }}"
          MSG=$(git log --oneline -1)
          if [[ "$TAG_OR_BRANCH" == *"hotfix"* ]] || \
             echo "$MSG" | grep -qi 'hotfix\|regression\|critical'; then
            echo "type=hotfix" >> $GITHUB_OUTPUT
          else
            echo "type=regular" >> $GITHUB_OUTPUT
          fi

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3  # v2
      - name: Install cargo-dist
        uses: cargo-bins/cargo-binstall@75b4bfae1b2c753a6806bbce6e6cb89b602de33c  # main
      - run: cargo binstall cargo-dist --no-confirm
      - name: Run cargo-dist
        run: cargo dist build --tag ${{ github.ref_name }}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3
        with:
          files: target/distroot/**/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            ${{ steps.release-type.outputs.type == 'hotfix' &&
                '> ⚠️ **HOTFIX RELEASE** — counts toward Change Failure Rate' || '' }}

      - name: Record Release Metric
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        with:
          script: |
            const type = '${{ steps.release-type.outputs.type }}';
            const event = {
              date: new Date().toISOString().split('T')[0],
              metric: type === 'hotfix' ? 'change_failure' : 'deployment',
              release: context.ref.replace('refs/tags/', ''),
              type: type,
              triggered_by: context.actor,
            };

            const fs = require('fs');
            fs.writeFileSync('dora-metrics.jsonl', JSON.stringify(event) + '\n');

      - name: Upload DORA Metrics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: dora-metrics-release-${{ github.ref_name }}
          path: dora-metrics.jsonl

  # Publish to crates.io
  publish:
    name: Publish to crates.io
    needs: [dist]
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3  # v2
      - name: Publish crate
        run: cargo publish --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Post-release health check (DORA FDRT)
  post-release-check:
    name: Post-Release Health Check
    needs: [publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v6
        with:
          ref: ${{ github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3  # v2

      - name: Build release binary
        id: build
        run: cargo build --release --workspace

      - name: Smoke test - verify binary runs
        id: smoke
        run: |
          ./target/release/sample-app --version

      - name: Record FDRT start time on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILED_AT: ${{ github.event.head_commit.timestamp }}
        run: |
          envsubst < .github/ISSUE_TEMPLATE/release-failure.md > /tmp/issue-body.md
          URL=$(gh issue create \
            --title "🚨 Release ${RELEASE_TAG} failed post-release health check" \
            --label "hotfix,release-failure" \
            --body-file /tmp/issue-body.md)
          echo "::error::Post-release check failed. Issue created: $URL"
          exit 1
