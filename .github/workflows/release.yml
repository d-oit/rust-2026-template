---
# .github/workflows/release.yml
# Automated release pipeline with cargo-dist
# Triggered by pushing a version tag: git tag v0.1.0 && git push --tags
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write
  packages: write
  id-token: write  # for OIDC Trusted Publishing

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  # Run full CI first
  ci:
    uses: ./.github/workflows/ci.yml

  # Build release binaries and create GitHub Release using cargo-dist
  dist:
    name: Build and Release
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-dist
        uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall cargo-dist --no-confirm
      - name: Run cargo-dist
        run: cargo dist build --tag ${{ github.ref_name }}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: target/distroot/**/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true

  # Publish to crates.io
  publish:
    name: Publish to crates.io
    needs: [dist]
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Publish crate
        run: cargo publish --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
