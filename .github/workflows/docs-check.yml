---
name: Docs sync check
on:
  pull_request:
    paths:
      - 'docs/**'
      - 'crates/**'
      - 'src/**'
      - 'README.md'
      - 'agents-docs/**'
      - 'Makefile'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'crates/**'
      - 'src/**'
      - 'README.md'
      - 'agents-docs/**'
      - 'Makefile'

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
      - name: Install doc tools
        uses: taiki-e/install-action@6887963ccf37a9ddcd8c5fa4baeb3e1e5fd61fa1  # v2
        with:
          tool: cargo-sync-readme,cargo-doc2readme@0.4.0
      - name: Check README sync
        run: cargo sync-readme --check
      - name: Regenerate pattern docs
        run: make docs
      - name: Assert no diff
        run: git diff --exit-code docs/patterns/
