---
name: Docs sync check
on:
  pull_request:
    paths:
      - 'docs/**'
      - 'crates/**'
      - 'src/**'
      - 'README.md'
      - 'agents-docs/**'
      - 'Makefile'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'crates/**'
      - 'src/**'
      - 'README.md'
      - 'agents-docs/**'
      - 'Makefile'

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
      - name: Install doc tools
        uses: taiki-e/install-action@2ca9b94c269419b7b0c711c09d0b21c4e1d51145  # v2
        with:
          tool: cargo-sync-readme,cargo-doc2readme@0.4.0
      - name: Check README sync
        run: cargo sync-readme --check
      - name: Regenerate pattern docs
        run: make docs
      - name: Assert no diff
        run: git diff --exit-code docs/patterns/
