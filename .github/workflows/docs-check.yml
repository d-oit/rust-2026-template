---
name: Docs sync check
on:
  pull_request:
    paths:
      - 'docs/**'
      - 'crates/**'
      - 'src/**'
      - 'README.md'
      - 'agents-docs/**'
      - 'Makefile'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'crates/**'
      - 'src/**'
      - 'README.md'
      - 'agents-docs/**'
      - 'Makefile'

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31  # v2
      - name: Install doc tools
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32  # v2
        with:
          tool: cargo-sync-readme,cargo-doc2readme@0.4.0
      - name: Check README sync
        if: hashFiles('src/lib.rs') != ''
        run: cargo sync-readme --check
      - name: Regenerate pattern docs
        run: make docs
      - name: Assert no diff
        run: git diff --exit-code docs/patterns/
