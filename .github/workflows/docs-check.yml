---
name: Docs sync check
on:
  pull_request:
  push:
    branches: [main]

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae  # v2
      - name: Install doc tools
        uses: taiki-e/install-action@e49978b799e49ff429d162b7a30601a569ab6538  # v2
        with:
          tool: cargo-sync-readme,cargo-doc2readme@0.4.0
      - name: Check README sync
        run: cargo sync-readme --check
      - name: Regenerate pattern docs
        run: make docs
      - name: Assert no diff
        run: git diff --exit-code docs/patterns/
