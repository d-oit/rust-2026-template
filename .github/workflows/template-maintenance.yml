---
# .github/workflows/template-maintenance.yml
# Template-specific maintenance checks
# These are NOT intended to be reused by downstream projects.
name: Template Maintenance

on:
  push:
    branches: [main, develop]
    paths:
      - 'CHANGELOG-TEMPLATE.md'
      - 'README.md'
      - '.github/workflows/template-maintenance.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'CHANGELOG-TEMPLATE.md'
      - 'README.md'
      - '.github/workflows/template-maintenance.yml'
  workflow_dispatch:

jobs:
  validate-template-metadata:
    name: Validate Template Metadata
    # Only run this on the source template repository, not in generated repos.
    if: github.repository == 'd-oit/rust-2026-template'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Ensure CHANGELOG-TEMPLATE.md exists and is distinct
        run: |
          if [ ! -f CHANGELOG-TEMPLATE.md ]; then
            echo "CHANGELOG-TEMPLATE.md is missing"
            exit 1
          fi
          if cmp -s CHANGELOG.md CHANGELOG-TEMPLATE.md; then
            echo "CHANGELOG-TEMPLATE.md must not be identical to CHANGELOG.md"
            exit 1
          fi
          echo "Template changelog exists and is distinct from project changelog."

      - name: Check Template Evolution badge
        run: |
          # Extract version from README badge
          BADGE_URL='\[!\[Template Evolution\](https://img.shields.io/badge/evolution-'
          BADGE_VERSION=$(grep -oP "${BADGE_URL}\K[0-9]+\.[0-9]+\.[0-9]+" README.md || true)
          if [ -z "$BADGE_VERSION" ]; then
            echo "Could not find 'Template Evolution' badge in README.md or it has no version"
            exit 1
          fi

          # Extract latest version from CHANGELOG-TEMPLATE.md
          CHANGELOG_VERSION=$(grep -oP '^## \[\K[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG-TEMPLATE.md | head -n 1 || true)
          if [ -z "$CHANGELOG_VERSION" ]; then
            echo "Could not find latest version in CHANGELOG-TEMPLATE.md"
            exit 1
          fi

          echo "Badge Version: $BADGE_VERSION"
          echo "Changelog Version: $CHANGELOG_VERSION"

          if [ "$BADGE_VERSION" != "$CHANGELOG_VERSION" ]; then
            echo "Mismatch: README badge ($BADGE_VERSION) does not match CHANGELOG-TEMPLATE.md ($CHANGELOG_VERSION)"
            exit 1
          fi
          echo "Template evolution version is consistent."

      - name: Verify badge link
        run: |
          if ! grep -q '\[!\[Template Evolution\].*\](CHANGELOG-TEMPLATE.md)' README.md; then
            echo "Template Evolution badge must link to CHANGELOG-TEMPLATE.md"
            exit 1
          fi
          echo "Badge link is correct."
