---
# .github/workflows/security-scan.yml
# Consolidated security scanning workflow
name: Security Scan

on:
  schedule:
    - cron: '0 8 * * 1'  # Weekly on Monday at 8am UTC
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - 'crates/**'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cargo-audit:
    name: Vulnerability Audit (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - uses: ./.github/actions/setup-rust
      - name: Install cargo-audit
        uses: taiki-e/install-action@fa23953489c080190314742a9b907f8e97c6767c  # v2
        with:
          tool: cargo-audit
      - name: Generate lockfile
        run: cargo generate-lockfile
      - name: Run cargo audit
        run: cargo audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cargo-deny:
    name: Dependency Policy (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25  # v2

  security-summary:
    name: Security Summary
    needs: [gitleaks, cargo-audit, cargo-deny]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check results
        run: |
          failed=()
          if [[ "${{ needs.gitleaks.result }}" == "failure" ]]; then
            failed+=("gitleaks: Secret Scan detected potential hardcoded credentials (run `gitleaks detect` locally)")
          fi
          if [[ "${{ needs.cargo-audit.result }}" == "failure" ]]; then
            failed+=("cargo-audit: Security advisory found in dependencies (run `cargo audit` locally)")
          fi
          if [[ "${{ needs.cargo-deny.result }}" == "failure" ]]; then
            failed+=("cargo-deny: Dependency policy violation found (run `cargo deny check` locally)")
          fi

          if [ ${#failed[@]} -ne 0 ]; then
            echo "::error::Security summary failed! Concrete failing job(s):"
            for f in "${failed[@]}"; do
              echo "  - $f"
            done
            exit 1
          fi
          echo "All security scans passed"
