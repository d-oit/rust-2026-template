name: Verify Actions Lockfile

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install lockfile extension
        run: gh extension install github/gh-actions-lock --pin v0.4.1
      - name: Verify lockfile
        run: gh actions-lock --verify
      - name: Test stale lockfile detection
        run: bash tests/actions_lock_cli_test.sh
