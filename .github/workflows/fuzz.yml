---
name: Fuzz

on:
  # Scheduled: weekly fuzz run (Tier 3 — heavy)
  # Manual: workflow_dispatch for ad-hoc runs with configurable duration
  # PR trigger removed — fuzzing is too expensive for every PR.
  push:
    branches: [main, develop]
    paths:
      - 'crates/**'
      - 'src/**'
      - 'fuzz/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - '.cargo/audit.toml'
      - 'scripts/check-fuzz-deps.sh'
  pull_request:
    branches: [main, develop]
    paths:
      - 'crates/**'
      - 'src/**'
      - 'fuzz/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - '.cargo/audit.toml'
      - 'scripts/check-fuzz-deps.sh'
  schedule:
    - cron: "0 2 * * 0"  # Weekly Sunday 02:00 UTC
  workflow_dispatch:
    inputs:
      duration:
        description: "Fuzz duration in seconds"
        default: "300"

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fuzz-dependencies:
    name: Fuzz Dependency Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32  # v2
        with:
          tool: cargo-audit,cargo-deny
      - name: Validate the excluded fuzz workspace dependency graph
        run: bash scripts/check-fuzz-deps.sh

  fuzz:
    runs-on: ubuntu-latest
    needs: [fuzz-dependencies]
    if: github.event_name != 'pull_request'
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31  # v2
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32  # v2
        with:
          tool: cargo-fuzz
      - run: >
          cargo fuzz run fuzz_sanitize
          --target x86_64-unknown-linux-gnu
          -- -max_total_time=${{ inputs.duration || 300 }}
