---
name: Fuzz

on:
  # Scheduled: weekly fuzz run (Tier 3 — heavy)
  # Manual: workflow_dispatch for ad-hoc runs with configurable duration
  # PR trigger removed — fuzzing is too expensive for every PR.
  push:
    branches: [main, develop]
    paths:
      - 'crates/**'
      - 'src/**'
      - 'fuzz/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - '.cargo/audit.toml'
      - 'scripts/check-fuzz-deps.sh'
  pull_request:
    branches: [main, develop]
    paths:
      - 'crates/**'
      - 'src/**'
      - 'fuzz/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - '.cargo/audit.toml'
      - 'scripts/check-fuzz-deps.sh'
  schedule:
    - cron: "0 2 * * 0"  # Weekly Sunday 02:00 UTC
  workflow_dispatch:
    inputs:
      duration:
        description: "Fuzz duration in seconds"
        default: "300"

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fuzz-dependencies:
    name: Fuzz Dependency Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b  # v2
        with:
          tool: cargo-audit,cargo-deny
      - name: Validate the excluded fuzz workspace dependency graph
        run: bash scripts/check-fuzz-deps.sh

  fuzz:
    runs-on: ubuntu-latest
    needs: [fuzz-dependencies]
    if: github.event_name != 'pull_request'
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b  # v2
        with:
          tool: cargo-fuzz
      - run: >
          cargo fuzz run fuzz_sanitize
          --target x86_64-unknown-linux-gnu
          -- -max_total_time=${{ inputs.duration || 300 }}
