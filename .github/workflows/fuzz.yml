---
name: Fuzz

on:
  # Scheduled: weekly fuzz run (Tier 3 — heavy)
  # Manual: workflow_dispatch for ad-hoc runs with configurable duration
  # PR trigger removed — fuzzing is too expensive for every PR.
  push:
    branches: [main, develop]
    paths:
      - 'crates/**'
      - 'src/**'
      - 'fuzz/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  schedule:
    - cron: "0 2 * * 0"  # Weekly Sunday 02:00 UTC
  workflow_dispatch:
    inputs:
      duration:
        description: "Fuzz duration in seconds"
        default: "300"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fuzz:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
      - uses: taiki-e/install-action@c93ccc03e00cd0e08e494f5fd058a6c55a6a1907  # v2
        with:
          tool: cargo-fuzz
      - run: >
          cargo fuzz run fuzz_sanitize
          --target x86_64-unknown-linux-gnu
          -- -max_total_time=${{ inputs.duration || 300 }}
