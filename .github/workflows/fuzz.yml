---
name: Fuzz

on:
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      duration:
        description: "Fuzz duration in seconds"
        default: "300"

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@cargo-fuzz
      - run: cargo fuzz run fuzz_parse_input -- -max_total_time=${{ inputs.duration || 300 }}
