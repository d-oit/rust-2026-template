---
name: Deploy mdBook to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - ".template/overview.svg"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install mdbook
        run: |
          MDBOOK_URL="https://github.com/rust-lang/mdBook/releases/download/v0.4.40"
          curl -sSL "${MDBOOK_URL}/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz" | tar xz
          sudo mv mdbook /usr/local/bin/

      - name: Sync overview SVG
        run: bash scripts/sync-architecture.sh

      - name: Setup mdbook
        run: bash scripts/setup-mdbook.sh

      - name: Build mdbook
        run: mdbook build docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: docs/book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
