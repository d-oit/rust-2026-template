---
name: Deploy mdBook to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - ".template/overview.svg"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install mdbook
        run: |
          MDBOOK_URL="https://github.com/rust-lang/mdBook/releases/download/v0.4.40"
          curl -sSL "${MDBOOK_URL}/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz" | tar xz
          sudo mv mdbook /usr/local/bin/

      - name: Sync overview SVG
        run: bash scripts/sync-architecture.sh

      - name: Setup mdbook
        run: bash scripts/setup-mdbook.sh

      - name: Build mdbook
        run: mdbook build docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: docs/book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
