# Minimal profile — the smallest buildable workspace.
# Keeps: one app crate (sample-app), the renamed example lib (example-crate), and xtask.
# Removes: optional pattern crates, benchmarks, fuzz, and heavy CI workflows.
[metadata]
id = "minimal"
display_name = "Minimal Rust App"
description = "Smallest buildable workspace: one app plus one library, no pattern crates."

[workspace]
include_crates = [
  "crates/example-crate",
  "crates/sample-app",
  "crates/xtask",
]
exclude_paths = [
  "benchmarks",
  "fuzz",
  ".template",
  "docs/patterns",
  ".agents/skills/architecture-diagram",
  ".agents/skills/atomic-commit",
  ".agents/skills/codacy",
  ".agents/skills/dora-report",
  ".agents/skills/goap-agent",
  ".agents/skills/issue-triage",
  ".agents/skills/metrics-reporter",
  ".agents/skills/self-fix-loop",
  ".agents/skills/skill-creator",
  ".agents/skills/skill-evaluator",
  ".agents/skills/stacked-prs",
  ".agents/skills/task-decomposition",
  ".agents/skills/tokio-performance",
  ".agents/skills/triz-analysis",
  ".agents/skills/triz-solver",
]
exclude_workflows = [
  "cleanup-ci-status.yml",
  "deploy-docs.yml",
  "dora-fdrt.yml",
  "dora-report.yml",
  "eval.yml",
  "fuzz.yml",
  "labeler.yml",
  "mutants.yml",
  "patch-release-on-label.yml",
  "skills-evaluation.yml",
  "sync-labels.yml",
  "update-architecture-diagram.yml",
]

[ci]
default_tier = "pull-request"

[policy]
lockfile = "committed"
publish_packages = []

[post_init]
checklist = [
  "set-package-metadata",
  "commit-cargo-lock",
  "configure-license-policy",
  "configure-branch-protection",
]
