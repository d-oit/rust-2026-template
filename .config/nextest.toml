# .config/nextest.toml - cargo-nextest configuration
# See: https://nexte.st/book/configuration.html

[profile.default]
# Show output from tests that fail
failure-output = "immediate"
# Show output from tests that succeed (set to "never" for quiet CI)
success-output = "never"
# Number of retries for flaky tests
retries = 0

[profile.ci]
# CI-specific settings
failure-output = "immediate-final"
success-output = "never"
# Retry flaky tests once in CI
retries = 1
# Slow test threshold
slow-timeout = { period = "60s", terminate-after = 3 }
# Leak timeout
leak-timeout = "5s"

[profile.default.junit]
# JUnit XML output for CI reporting
# path = "test-results/nextest.xml"
