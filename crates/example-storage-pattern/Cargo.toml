[package]
name = "example-storage-pattern"
version.workspace = true
edition.workspace = true
description = "Template pattern: trait-only storage layer with swappable backends"
publish = false

[lints]
workspace = true

[features]
default = []
sqlite = ["dep:rusqlite"]
mock = []

[dependencies]
rusqlite = { version = "0.32", optional = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

# `rusqlite` is intentionally declared as the SQLite backend sketch for the
# `sqlite` feature even though the current trait-only implementation does
# not yet use it.  Once a real backend is added in a follow-up, drop this
# ignore entry.
[package.metadata.cargo-machete]
ignored = ["rusqlite"]
