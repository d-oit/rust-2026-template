[package]
name = "xtask"
version.workspace = true
edition.workspace = true
publish = false

# xtask is a development-only binary — not part of the public API.
# Run with: cargo run -p xtask <subcommand>
[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
clap = { workspace = true, features = ["derive"] }
anyhow = { workspace = true }

# Silence cargo-machete: anyhow and clap are used by the xtask binary.
[package.metadata.cargo-machete]
ignored = []
