[package]
name = "checkpoint-template"
# Standalone version: this is the first publicly published crate, so it carries
# its own semver instead of the workspace `0.0.0` placeholder. See
# docs/src/releasing/crates-io-trusted-publishing.md.
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Secure and high-performance checkpointing template for state-intensive applications"
readme = "README.md"
include = ["/src", "README.md", "LICENSE"]
publish = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "io-util", "fs"] }
tracing = { workspace = true }
bincode_reloaded = { version = "3", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
